<header class="review"><div><b>工作台整体评审<span class="review-mark">合成数据 · 可操作原型</span></b><p>检验底部交互、历史、草稿与恢复是否协调。演示状态在当前标签页保留，未连接后端。</p></div><nav class="review-controls" aria-label="评审工具"><select id="scene" aria-label="选择评审场景"><option value="progress">完整预约</option><option value="long">32 字段长表单</option><option value="images">图片与发送恢复</option><option value="unknown">操作结果待核对</option><option value="render">内容渲染示例</option></select><button id="step">下一条执行说明</button><button id="simulate">更多演示操作</button><button id="network">模拟断线</button><button id="loginFlow">登录流程</button></nav></header>

<script>
'use strict';
const $=id=>document.getElementById(id), key='agentscope-prototype-review-v1:demo-user', objectUrls=new Set();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={product:'张同学 · 产品组',tech:'张同学 · 技术组'};
const phases=['正在理解预约需求','正在提取日期、主题与参会人','正在查询会议室（模拟）'];
const labels={PREPARING:'正在处理',FORM:'等待补充信息',CONFIRM:'等待单独确认',DONE:'已取得成功回执（模拟）',UNKNOWN:'操作结果待核对',CANCELLED:'已取消（模拟）',EXPIRED:'确认已过期',READY:'可以开始对话'};
const initial=scene=>({scene,auth:'workbench',current:'task',online:true,query:'',counter:0,last:'已打开合成场景；没有真实任务',sessions:[{id:'task',title:scene==='images'?'图片沟通':scene==='render'?'内容渲染示例':'预约产品评审会',archived:false,version:'V3',stage:scene==='images'||scene==='render'?'READY':scene==='unknown'?'UNKNOWN':scene==='long'?'FORM':'PREPARING',phase:0,person:scene==='unknown'?'product':'',duration:'60',draft:'',formValues:{},savedForm:{},saved:false,long:scene==='long',answered:scene==='unknown',images:[],messages:[],sendPending:null,sendUnknown:false,conflict:false,errors:[]},{id:'earlier',title:'查询会议室',archived:false,version:'V1',stage:'READY',draft:'',images:[],messages:[{id:'h1',role:'user',text:'帮我查一下 17 楼有哪些会议室。'},{id:'h2',role:'assistant',text:'上次查询有一间 6 人会议室。历史结果不代表现在仍有空闲。'}]}]});
// Portable synthetic transition model: no DOM, transport or tool calls.
function reduce(current,action){const next=structuredClone(current),s=next.sessions.find(x=>x.id===next.current);next.last=action.note||next.last;
 switch(action.type){
 case 'switch':next.current=action.id;break;
 case 'phase':if(s.stage==='PREPARING'){s.phase++;if(s.phase>=3)s.stage='FORM'}break;
 case 'person':s.person=action.value;s.saved=false;s.errors=(s.errors||[]).filter(e=>e!=='person');break;
 case 'duration':s.duration=action.value;s.saved=false;break;
 case 'save':s.saved=true;s.savedForm={...s.formValues,person:s.person,duration:s.duration};break;
 case 'submit':if(s.stage==='FORM'){const missing=[];if(!s.person)missing.push('person');if(s.long){if(!s.formValues.f1?.trim())missing.push('f1');if(!s.formValues.f30?.trim())missing.push('f30')}s.errors=missing;if(!missing.length){s.stage='CONFIRM';s.answered=true;s.saved=true}}break;
 case 'confirm':if(s.stage==='CONFIRM')s.stage=action.unknown?'UNKNOWN':'DONE';break;
 case 'cancel':if(['FORM','CONFIRM','PREPARING'].includes(s.stage))s.stage='CANCELLED';break;
 case 'expire':if(s.stage==='CONFIRM')s.stage='EXPIRED';break;
 case 'end-expired':if(s.stage==='EXPIRED')s.stage='CANCELLED';break;
 case 'network':next.online=!next.online;break;
 case 'rename':{const target=next.sessions.find(x=>x.id===action.id);if(target)target.title=action.value;break}
 case 'conflict':s.conflict=true;break;
 case 'resolve-conflict':s.conflict=false;if(action.server){s.person='tech';s.duration='90'}s.saved=true;s.savedForm={...s.formValues,person:s.person,duration:s.duration};break;
 case 'new':{const id='intent-'+(++next.counter);next.sessions.push({id,title:'新会话',archived:false,version:'V3',stage:'READY',draft:'',images:[],messages:[],isIntent:true});next.current=id;break}
 case 'send':{if(s.sendPending)break;const bundle={text:s.draft,images:s.images.map(i=>({name:i.name,ref:i.ref})),submission:s.retrySubmission&&s.retryBody===JSON.stringify([s.draft,s.images.map(i=>i.ref)])?s.retrySubmission:'demo-submission-'+(++next.counter)};s.sendPending=bundle;if(!s.sendUnknown)acceptSynthetic(next,s);break}
 case 'reconcile':if(s.sendPending){if(action.accepted)acceptSynthetic(next,s);else{s.retrySubmission=s.sendPending.submission;s.retryBody=JSON.stringify([s.draft,s.images.map(i=>i.ref)]);s.sendPending=null;s.sendUnknown=false}}break;
 }
 return next;
}
function acceptSynthetic(next,s){const b=s.sendPending;if(!b)return;s.messages.push({id:b.submission,role:'user',text:b.text,images:b.images});s.messages.push({id:b.submission+'-answer',role:'assistant',text:'已接纳这条消息（合成演示）。这里没有调用模型。'});if(s.isIntent){s.isIntent=false;s.title=b.text.trim().replace(/\s+/g,' ').slice(0,28)||'图片会话 · 10月24日';s.id='session-'+next.counter;next.current=s.id}s.draft='';s.images=[];s.sendPending=null;s.sendUnknown=false;s.retrySubmission=null;s.retryBody=null}
let state,storageOK=true,dockKey='',modalTrigger=null,isComposing=false,nearBottom=true,newCount=0,deferForm=false;

function send(){const s=session();if(!$('send')||$('send').disabled)return;dispatch({type:'send',note:s.sendUnknown?'发送结果待核对（模拟）；内容及原提交键已冻结':'同一次提交已接纳（模拟）'});if(!session().sendPending)nearBottom=true}
function showConflict(){if(session().stage!=='FORM')return;dispatch({type:'conflict',note:'模拟另一标签更新草稿；本地值保留'});const s=session();openModal('表单草稿已在另一标签更新',`<p>请比较后选择，原填写仍保留。重新应用只保存草稿，不提交回答。</p><table class="compare"><thead><tr><th>字段</th><th>我的填写</th><th>服务端已保存</th></tr></thead><tbody><tr><td>参会人</td><td>${esc(names[s.person]||'未选择')}</td><td>${names.tech}</td></tr><tr><td>时长</td><td>${esc(s.duration)} 分钟</td><td>90 分钟</td></tr></tbody></table>`,[{label:'采用服务端草稿',run:()=>{dispatch({type:'resolve-conflict',server:true,note:'已采用服务端草稿（模拟），尚未提交回答'});closeModal()}},{label:'应用我的填写到最新草稿',primary:true,run:()=>{dispatch({type:'resolve-conflict',server:false,note:'已按最新草稿版本应用本地填写（模拟）'});closeModal()}}])}
function showSimulation(){const s=session();const buttons=[];let text='这些按钮只推进合成场景，没有真实上传、鉴权或业务执行。';if(s.stage==='FORM'){buttons.push({label:'模拟草稿冲突',run:()=>{closeModal();showConflict()}})}if(s.stage==='CONFIRM'){buttons.push({label:'模拟确认过期',run:()=>{dispatch({type:'expire',note:'原确认已过期，不能续期'});closeModal()}},{label:'下次确认返回未知结果',run:()=>{s.nextUnknown=true;persist();closeModal();notify('接下来点击确认预约，将展示结果待核对')}})}if(s.stage==='EXPIRED')buttons.push({label:'模拟已核实未发送并结束旧任务',run:()=>{dispatch({type:'end-expired',note:'旧任务已安全结束（模拟），未自动生成新提案'});closeModal()}});if(s.stage==='READY'){if(!s.sendPending){buttons.push({label:'添加示例图片',run:()=>{s.images.push({id:'sample-'+(++state.counter),name:'会议草图.png',status:'local',ref:null});persist();renderDock();closeModal()}});for(const [status,label] of [['ready','模拟图片全部就绪'],['failed','模拟图片准备失败'],['unknown','模拟图片上传结果未知']])buttons.push({label,run:()=>{for(const i of s.images){i.status=status;if(status==='ready')i.ref='demo-ref-'+i.id}persist();renderDock();closeModal();notify('只更新了演示图片状态')}});buttons.push({label:'下次发送结果不明',run:()=>{s.sendUnknown=true;persist();closeModal();notify('准备完成后点击发送，将保留待核对卡')}})}else buttons.push({label:'查询：模拟查到原提交已接纳',run:()=>{dispatch({type:'reconcile',accepted:true,note:'原提交已接纳（模拟），没有新增一次发送'});closeModal()}},{label:'查询：模拟确定未接纳',run:()=>{dispatch({type:'reconcile',accepted:false,note:'已确定未接纳（模拟）；等待用户明确重试'});closeModal()}})}if(!buttons.length)text+=' 当前可切换其他场景体验。';openModal('合成场景操作',`<p>${text}</p><p class="muted">刷新时：未就绪本地图片需重选；就绪引用仅演示恢复。保存的合成快照不证明真实服务端持久化。</p>`,buttons)}
function renderAuth(){const change=state.auth==='change';$('app').hidden=true;$('auth').hidden=false;$('auth').innerHTML=`<div class="auth-card"><div class="brand-icon">✦</div><h1>${change?'设置你的新密码':'欢迎回来'}</h1><p>${change?'首次登录后先设置新密码，再进入工作台。':'海卓智慧大脑 · 会议室数字员工'}</p>${change?'<label>新密码<input type="password" placeholder="仅展示，不接收真实密码" readonly></label><label>再次输入新密码<input type="password" placeholder="仅展示，不接收真实密码" readonly></label>':'<label>手机号<input value="演示账号" readonly></label><label>密码<input type="password" placeholder="仅展示，不接收真实密码" readonly></label>'}<button class="primary" id="authButton">${change?'模拟完成改密并进入工作台':'模拟首次登录'}</button><p>合成页面演示，不接收真实口令，不执行认证。没有管理员入口。</p></div>`;$('authButton').onclick=()=>{state.auth=change?'workbench':'change';state.last=change?'模拟改密完成，已进入工作台':'受限改密页面，尚未进入工作台';render();if(change)persist()}}
function render(){const s=session();$('scene').value=state.scene;$('step').disabled=s.stage!=='PREPARING'||!state.online;$('network').textContent=state.online?'模拟断线':'恢复连接';$('status').textContent='评审状态 · '+labels[s.stage]+(s.sendPending?' · 发送结果待核对':'');$('last').textContent=state.last;if(state.auth!=='workbench'){renderAuth();return}$('app').hidden=false;$('auth').hidden=true;renderSidebar();$('title').textContent=s.title;$('subtitle').textContent='会议室助手 · '+labels[s.stage];$('sessionMore').disabled=!!s.isIntent;let banner='';if(!state.online)banner='连接已断开，任务状态未改变。输入保留，恢复连接后再提交。';else if(s.conflict)banner='草稿存在冲突，本地填写已保留。';$('banner').hidden=!banner;$('banner').textContent=banner;renderMessages();renderDock()}
function isNearBottom(){const c=$('chat');return c.scrollHeight-c.scrollTop-c.clientHeight<72}$('chat').onscroll=()=>{nearBottom=isNearBottom();if(nearBottom&&!deferForm){newCount=0;$('newContent').hidden=true}};$('newContent').onclick=()=>{if(deferForm){deferForm=false;renderDock(true)}$('chat').scrollTop=$('chat').scrollHeight;nearBottom=true;newCount=0;$('newContent').hidden=true;if(session().stage==='FORM')$('person-product')?.focus()};
$('step').onclick=()=>{if(actionAllowed())dispatch({type:'phase',note:'收到一条合成阶段说明；没有原始思考文本'});if(session().stage==='FORM'&&!nearBottom){$('newContent').textContent='补充信息已就绪 · 点击查看';$('newContent').hidden=false}};$('network').onclick=()=>dispatch({type:'network',note:'连接状态改变（模拟），未执行或重发任何任务'});$('sessionMore').onclick=()=>showMore();$('newChat').onclick=()=>dispatch({type:'new',note:'打开空白编辑页；首条消息接纳前尚无正式会话（模拟）'});$('simulate').onclick=showSimulation;$('search').oninput=e=>{state.query=e.target.value;renderSidebar()};$('loginFlow').onclick=()=>{state.auth='login';render()};$('logout').onclick=()=>{try{sessionStorage.removeItem(key)}catch{}for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.clear();state=initial('progress');state.auth='login';dockKey='';render();notify('已清理当前标签页的本原型记录；真实跨标签退出未接入')};
function resetScene(scene){for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.clear();state=initial(scene);deferForm=false;dockKey='';$('stream').dataset.view='';nearBottom=true;$('newContent').hidden=true;const url=new URL(location.href);url.searchParams.set('scene',scene);history.replaceState(null,'',url);persist();render()}
$('scene').onchange=e=>resetScene(e.target.value);window.addEventListener('beforeunload',()=>{for(const url of objectUrls)URL.revokeObjectURL(url)});
const fromUrl=new URLSearchParams(location.search).get('scene'),stored=readStored();state=stored&&(!fromUrl||fromUrl===stored.scene)?stored:initial(['progress','long','images','unknown','render'].includes(fromUrl)?fromUrl:'progress');render();
</script>
</body>
