ht:520px}.layout{display:grid;gap:18px;min-height:530px}.panel{border:1px solid var(--line);background:#fff;border-radius:16px;box-shadow:0 5px 22px #18332007}.label{font-size:10px;font-weight:750;letter-spacing:.12em;color:#8b968e;text-transform:uppercase}.muted{color:var(--muted)}.small{font-size:11px;line-height:1.6}.quiet{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:600}.quiet:hover{background:#f8faf8;border-color:#cad6cc}.primary{border:0;background:var(--green);color:#fff;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:700}.primary:hover{background:#105638}.softbtn{border:1px solid #d6e7da;background:#f1f7f2;color:#216343;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:650}.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 9px;background:#f1f3f1;color:#647168;font-size:10px;font-weight:650}.pill.green{background:#eaf5ee;color:#286a49}.pill.blue{background:#eef3fa;color:#496992}.pill.amber{background:#fff5df;color:#8d641d}.dot{width:7px;height:7px;border-radius:100%;background:#53a577}.avatar{width:30px;height:30px;display:grid;place-items:center;background:#eaf3ec;color:#28704c;border-radius:10px;font-size:11px;font-weight:750;flex:none}.avatar.blue{background:#edf2fa;color:#4f6990}.avatar.gold{background:#fbf0db;color:#98701c}.avatar.purple{background:#f1ebf7;color:#72508d}.bubble{background:#f4f6f4;border-radius:4px 13px 13px 13px;padding:12px 14px;font-size:12px;line-height:1.75;color:#35443a;max-width:670px}.userbubble{background:#eaf3ed;border-radius:13px 4px 13px 13px}.chatrow{display:flex;gap:10px;align-items:flex-start;margin:0 0 17px}.chatrow.user{flex-direction:row-reverse}.chatmeta{font-size:10px;color:#88938c;margin:1px 0 6px;display:flex;align-items:center;gap:7px}.chatrow.user .chatmeta{justify-content:flex-end}.composer{display:flex;align-items:flex-end;gap:9px;padding:10px 11px;border:1px solid #dfe5df;border-radius:13px;background:#fff}.composer textarea{resize:vertical;min-height:38px;max-height:100px;flex:1;border:0;outline:0;font-size:12px;line-height:1.6;color:var(--ink);padding:7px 5px}.composer button{height:36px}.composer-note{text-align:center;font-size:9px;color:#9aa39d;margin-top:8px}.worker-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#e8f3eb;color:#28734b;font-size:12px;font-weight:750}.rule{height:1px;background:#edf0ed;margin:14px 0}
    /* A: open input -> route card -> specialist-owned chat. */
    .a-layout{grid-template-columns:minmax(0,1.45fr) minmax(240px,.75fr)}.a-main{padding:24px 25px;min-height:500px;display:flex;flex-direction:column}.a-welcome{margin:auto 0 22px;max-width:680px}.a-orb{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#e8f4eb,#f7f1df);display:grid;place-items:center;color:#27734b;font-weight:800;font-size:16px;margin-bottom:18px}.a-welcome h2{font-size:21px;margin:0 0 9px;letter-spacing:-.035em}.a-welcome p{font-size:12px;color:#77827a;line-height:1.7;margin:0;max-width:550px}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}.suggestions button{border:1px solid #e5eae5;background:#fff;color:#657168;border-radius:999px;padding:7px 10px;font-size:10px}.a-route{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid #dfe8df;border-radius:12px;background:#fbfdfb;margin-bottom:15px}.a-route-copy{flex:1;min-width:0}.a-route-copy strong{font-size:12px;display:block}.a-route-copy small{font-size:10px;color:#77827a;display:block;margin-top:4px;line-height:1.5}.a-side{padding:19px}.a-side h3{font-size:13px;margin:8px 0 4px}.flow{display:grid;gap:0;margin:18px 0}.flow-step{display:grid;grid-template-columns:20px 1fr;gap:9px;position:relative;min-height:52px}.flow-step:not(:last-child):before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:#e0e6e0}.flow-num{width:17px;height:17px;border-radius:50%;background:#eff2ef;color:#77827a;text-align:center;line-height:17px;font-size:9px;z-index:1}.flow-step.done .flow-num{background:#e3f2e7;color:#216c43}.flow-step.active .flow-num{background:#176b4b;color:#fff}.flow-step strong{font-size:10px;display:block}.flow-step small{font-size:9px;color:#8b958e;display:block;margin-top:3px;line-height:1.45}.handoff{padding:12px;background:#f8f6ee;border:1px solid #eee8d5;border-radius:11px;margin-top:12px}.handoff strong{font-size:10px}.handoff p{font-size:10px;line-height:1.55;color:#746a54;margin:5px 0 9px}.handoff button{font-size:10px}
    /* B: parent-owned chat plus a visible orchestration board. */
    .b-layout{grid-template-columns:minmax(0,1.2fr) minmax(300px,.85fr)}.b-chat{padding:0 21px 17px;display:flex;flex-direction:column;min-height:530px}.b-header{display:flex;align-items:center;gap:11px;padding:18px 2px 15px;border-bottom:1px solid #edf0ed;margin-bottom:19px}.b-header-copy{flex:1}.b-header-copy strong{font-size:13px;display:block}.b-header-copy small{font-size:10px;color:#879188;display:block;margin-top:4px}.b-messages{flex:1}.b-board{padding:19px}.board-head{display:flex;align-items:center;gap:10px}.board-head h3{margin:0;font-size:13px}.board-head small{display:block;color:#879188;font-size:10px;margin-top:4px}.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:start;padding:13px 0;border-bottom:1px solid #edf0ed}.task:last-child{border:0}.task-icon{height:23px;width:23px;display:grid;place-items:center;border-radius:8px;background:#f1f4f1;color:#64736a;font-size:10px;font-weight:700}.task.done .task-icon{background:#e7f4ea;color:#27734b}.task-copy strong{font-size:10px;display:block;line-height:1.5}.task-copy small{font-size:9px;color:#879188;display:block;margin-top:3px}.task-state{font-size:9px;color:#7b867e;white-space:nowrap}.task.running .task-state{color:#a27117}.task.done .task-state{color:#27804d}.board-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.confirm-box{margin-top:15px;border:1px solid #efdfbb;background:#fffaf0;border-radius:11px;padding:12px}.confirm-box strong{font-size:10px;display:flex;align-items:center;gap:7px}.confirm-box p{font-size:10px;color:#786a4a;line-height:1.6;margin:7px 0 10px}.summary-box{padding:12px;border-radius:10px;background:#edf6ef;color:#315e40;font-size:11px;line-height:1.6;margin-top:13px}
    /* C: one transcript where the active employee may change on every message. */
    .c-layout{grid-template-columns:minmax(0,1fr) 280px}.c-chat{padding:19px 21px;min-height:530px;display:flex;flex-direction:column}.c-head{display:flex;gap:10px;align-items:center;padding:0 0 15px;border-bottom:1px solid #edf0ed;margin-bottom:17px}.c-head-copy{flex:1}.c-head-copy strong{display:block;font-size:13px}.c-head-copy small{display:block;font-size:10px;color:#879188;margin-top:4px}.c-transcript{flex:1;max-height:375px;overflow:auto;padding:2px 3px}.route-badge{font-size:9px;color:#5d6b61;background:#eef2ef;border-radius:999px;padding:4px 7px;display:inline-flex;margin-top:6px}.route-badge.uncertain{background:#fff4df;color:#8b641d}.c-side{padding:18px}.route-log{display:grid;gap:8px;margin:15px 0}.route-log-item{padding:10px;border:1px solid #e8ece8;border-radius:9px;background:#fafbfa}.route-log-item strong{font-size:10px;display:block}.route-log-item small{font-size:9px;color:#879188;display:block;margin-top:4px;line-height:1.5}.c-tip{padding:11px;border-radius:10px;background:#fff7e7;color:#806328;font-size:10px;line-height:1.6}
    /* D: directory + employee-specific session history + conversation. */
    .d-layout{grid-template-columns:185px 230px minmax(0,1fr);min-height:550px}.d-employees{padding:14px 10px}.d-heading{padding:5px 8px 12px}.d-employee{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:10px 9px;border-radius:10px;text-align:left;margin:2px 0}.d-employee:hover{background:#f5f7f5}.d-employee.active{background:#eaf4ed;color:#205f3d}.d-employee-copy{min-width:0}.d-employee-copy strong{font-size:10px;display:block}.d-employee-copy small{font-size:9px;color:#88938c;display:block;margin-top:4px;line-height:1.3}.d-history{padding:14px 10px;border-left:1px solid #edf0ed}.d-history-head{display:flex;align-items:center;padding:5px 7px 13px}.d-history-head strong{font-size:11px;flex:1}.d-history-item{padding:10px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}.d-history-item:hover{background:#f7f9f7}.d-history-item.active{background:#eff6f1;border-color:#e0ebe2}.d-history-item strong{font-size:10px;display:block}.d-history-item small{font-size:9px;color:#89938c;display:block;margin-top:5px}.d-thread{display:flex;flex-direction:column;min-width:0}.d-thread-head{padding:17px 18px;border-bottom:1px solid #edf0ed;display:flex;align-items:center;gap:10px}.d-thread-head-copy{flex:1}.d-thread-head-copy strong{font-size:12px;display:block}.d-thread-head-copy small{font-size:9px;color:#849087;display:block;margin-top:4px}.d-messages{padding:19px 18px;flex:1;min-height:280px}.d-compose-wrap{padding:0 17px 16px}.d-new{border:0;background:transparent;color:#297049;font-size:10px;font-weight:700;padding:7px}.d-switch-note{background:#f4f7f4;color:#69766d;border-radius:9px;padding:9px 10px;font-size:9px;line-height:1.5;margin:3px 8px 10px}
    .state-card{margin-top:18px;padding:16px 18px;display:grid;grid-template-columns:160px repeat(3,minmax(0,1fr));gap:15px;align-items:center}.state-title{font-size:10px;letter-spacing:.1em;color:#849087;text-transform:uppercase;font-weight:750}.state-item{border-left:1px solid #e9ede9;padding-left:13px;min-height:34px}.state-item small{display:block;color:#8b958e;font-size:9px;margin-bottom:5px}.state-item strong{font-size:10px;line-height:1.5;display:block;font-weight:650}.switcher{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:999px;background:#183c29;color:white;box-shadow:0 10px 35px #183c2948}.switcher button{border:0;width:30px;height:30px;border-radius:50%;color:white;background:#ffffff20;font-size:16px}.switcher button:hover{background:#ffffff38}.switcher-label{font-size:10px;font-weight:650;min-width:188px;text-align:center}.toast{position:fixed;z-index:11;bottom:77px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:.2s;background:#24392c;color:white;border-radius:9px;padding:9px 13px;font-size:10px;box-shadow:0 7px 22px #182a1e33}.toast.show{opacity:1;transform:translate(-50%,0)}.prototype-note{max-width:800px;margin:15px auto 0;text-align:center;color:#929c94;font-size:9px;line-height:1.6}
    @media(max-width:1000px){.intro{align-items:flex-start;flex-direction:column}.mode-tabs{width:100%;overflow:auto}.a-layout,.b-layout{grid-template-columns:minmax(0,1fr) 270px}.d-layout{grid-template-columns:145px 190px minmax(0,1fr)}.d-employee{padding:9px 6px}.state-card{grid-template-columns:130px repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){.app{padding:0 13px}.topbar{height:61px}.scenario-strip{align-items:flex-start}.scenario-strip span:last-child{display:none}.a-layout,.b-layout,.c-layout{grid-template-columns:1fr}.a-side,.b-board,.c-side{min-height:0}.a-main{min-height:430px;padding:18px}.b-chat{min-height:425px}.c-chat{min-height:470px}.d-layout{grid-template-columns:1fr 1fr}.d-employees{grid-column:1/-1;display:flex;gap:3px;overflow:auto;padding:10px}.d-heading{display:none}.d-employee{min-width:120px;width:auto}.d-history{border-left:0;border-top:1px solid #edf0ed}.d-thread{grid-column:1/-1;min-height:390px;border-top:1px solid #edf0ed}.state-card{grid-template-columns:1fr 1fr;gap:11px}.state-title{grid-column:1/-1}.state-item:nth-child(2){border:0;padding-left:0}.switcher-label{min-width:155px}.mode-tabs button{padding:9px}}
    @media(max-width:420px){.prototype-tag{display:none}.intro h1{font-size:21px}.d-layout{grid-template-columns:1fr}.d-employees{grid-column:auto}.d-history{grid-column:auto;max-height:150px;overflow:auto}.d-thread{grid-column:auto}.state-card{padding:14px}.state-item{padding-left:9px}.switcher{bottom:12px}}

<body>
  <div class="app">
    <header class="topbar"><div class="logo">员</div><div class="brand">企业数字员工<small>工作台 · 交互形态比较</small></div><div class="topspacer"></div><span class="scenario-tag">同一任务 · 四种入口</span><span class="prototype-tag">原型演示 · 内存状态</span></header>
    <section class="intro"><div class="intro-copy"><div class="eyebrow">Product exploration · A / B / C / D</div><h1>一句需求，四种协作方式</h1><p>切换入口模式，观察谁拥有对话、谁处理追问，以及多员工任务怎样呈现。</p></div><nav class="mode-tabs" id="mode-tabs" aria-label="选择入口模式"></nav></section>
    <div class="scenario-strip"><span class="scenario-icon">案</span><strong>共同演示任务</strong><span>帮我安排明天下午 3 点的 8 人客户会议，再整理一份接待清单。</span></div>
    <main class="main" id="app-view"></main>
    <p class="prototype-note">这是可丢弃的交互原型。按钮只模拟交接、委派与状态变化，不连接模型、会议工具、账号或数据库；刷新页面会重置演示。</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="switcher" aria-label="切换原型模式"><button type="button" id="prev" aria-label="上一个模式">‹</button><div class="switcher-label" id="switcher-label"></div><button type="button" id="next" aria-label="下一个模式">›</button></div>
  <script>
    const MODES=[
      {id:"A",name:"统一入口分流",title:"描述需求，系统帮你找员工"},
      {id:"B",name:"统一助理委派",title:"统一助理负责到底，专家后台协作"},
      {id:"C",name:"每轮重新分配",title:"每句话都可能换一位员工回答"},
      {id:"D",name:"显式选择员工",title:"先选好员工，再在它的空间继续"}
    ];
    const SCENARIO="帮我安排明天下午 3 点的 8 人客户会议，再整理一份接待清单。";
    const EMPLOYEES=[
      {id:"meeting",name:"会议室助手",mark:"会",tone:"green",description:"会议室查询、预约与日程安排"},
      {id:"project",name:"项目助理",mark:"项",tone:"blue",description:"项目跟进、材料整理与协作"},
      {id:"expense",name:"报销助手",mark:"报",tone:"gold",description:"报销制度、票据与费用查询"}
    ];
    const initialStates=()=>({
      A:{started:false,employee:"meeting",text:SCENARIO,messages:[],handoff:false},
      B:{text:SCENARIO,messages:[SCENARIO],meetingDone:false,listDone:false,booking:"waiting",summary:false},
      C:{text:"",messages:[],lastEmployee:"meeting",turn:0},
      D:{employee:"meeting",session:"客户接待会议",text:"",messages:[],savedSessions:{},notice:false}
    });
    let states=initialStates();
    const params=new URLSearchParams(location.search);
    let current=(params.get("mode")||"A").toUpperCase();if(!MODES.some(m=>m.id===current))current="A";
    const $=selector=>document.querySelector(selector);
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const employee=id=>EMPLOYEES.find(item=>item.id===id)||EMPLOYEES[0];
    function setMode(id){current=id;const url=new URL(location.href);url.searchParams.set("mode",id);history.replaceState({},"",url);render();}
    function toast(message){const node=$("#toast");node.textContent=message;node.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove("show"),2100);}
    function chatRow({who,text,employeeId,tag=""}){const user=who==="你";const target=employee(employeeId||"meeting");const tone=user?"":" "+target.tone;return `<div class="chatrow ${user?"user":""}"><div class="avatar${tone}">${user?"你":target.mark}</div><div><div class="chatmeta"><span>${escapeHtml(who)}</span>${tag?`<span class="pill ${tag.includes("待确认")?"amber":""}">${escapeHtml(tag)}</span>`:""}</div><div class="bubble ${user?"userbubble":""}">${escapeHtml(text)}</div></div></div>`;}
    function routeEmployee(text){if(/报销|发票|费用|差旅/.test(text))return"expense";if(/项目|周报|进度|交付|材料|摘要/.test(text))return"project";return"meeting";}
    function renderTabs(){const tabs=$("#mode-tabs");tabs.innerHTML=MODES.map(mode=>`<button type="button" data-mode="${mode.id}" class="${current===mode.id?"active":""}">${mode.id} · ${mode.name}</button>`).join("");const active=MODES.find(mode=>mode.id===current);$("#switcher-label").textContent=`${active.id} · ${active.name}`;}
    function aState(s){const owner=s.started?employee(s.employee).name:"等待识别目标员工";return `<span class="state-title">当前体验状态</span><div class="state-item"><small>入口</small><strong>统一输入框</strong></div><div class="state-item"><small>对话负责人</small><strong>${escapeHtml(owner)}</strong></div><div class="state-item"><small>跨员工事项</small><strong>${s.handoff?"已发起一次交接":"接待清单需要确认是否改派"}</strong></div>`;}
    function renderA(){const s=states.A;const e=employee(s.employee);const mode=MODES[0];return `<div class="layout a-layout">
      <section class="panel a-main"><div class="a-welcome"><div class="a-orb">AI</div><div class="eyebrow">${mode.id} · ${mode.name}</div><h2>你好，今天想处理什么？</h2><p>直接说目标。系统先识别一位最匹配的员工，再把会话交给他持续处理。任务里如果包含另一种职责，会先提醒你改派或分开办理。</p><div class="suggestions"><button type="button" data-action="a-fill">试用共同演示任务</button><button type="button" data-action="a-fill-project">换成项目任务</button></div></div>
      ${s.started?`<div class="a-route"><div class="worker-icon">${e.mark}</div><div class="a-route-copy"><strong>已分配给 ${e.name}</strong><small>后续消息会留在这位员工的会话中。${s.employee==="meeting"?"接待清单属于另一项工作，可在完成会议后再交接。":""}</small></div><button type="button" class="quiet" data-action="a-change">改派</button></div><div style="flex:1;min-height:15px">${s.messages.map((text,index)=>`${chatRow({who:"你",text})}${index===s.messages.length-1?chatRow({who:e.name,employeeId:s.employee,text:s.employee==="meeting"?"我来安排会议。先确认园区，再查询能容纳 8 人的空闲会议室。接待清单可以稍后交给项目助理。":"我来接手这项工作。请补充需要整理的项目或资料范围。"}):""}`).join("")}${s.handoff?chatRow({who:"项目助理",employeeId:"project",text:"会议需求摘要已交接。我会单独整理接待清单，不会读取其他会话历史。",tag:"独立新会话"}):""}</div>`:`<div style="flex:1"></div>`}
      <form class="composer" data-form="a"><textarea name="message" aria-label="描述需求" placeholder="例如：准备客户接待、整理项目周报……">${s.started?"":escapeHtml(s.text)}</textarea><button class="primary" type="submit">${s.started?"发送给当前员工":"寻找合适员工 →"}</button></form><div class="composer-note">${s.started?`当前对话：${e.name} · 可在此改派`:"系统会先展示分配结果，你可以随时改派"}</div></section>
      <aside class="panel a-side"><div class="label">分流过程</div><h3>系统先找负责人</h3><div class="small muted">单次识别入口，进入员工后保持负责人。</div><div class="flow"><div class="flow-step ${s.started?"done":"active"}"><span class="flow-num">1</span><div><strong>理解用户需求</strong><small>从任务内容提取主要职责</small></div></div><div class="flow-step ${s.started?"active":""}"><span class="flow-num">2</span><div><strong>选择一位员工</strong><small>${s.started?`已选：${e.name}`:"识别后显示目标，可人工纠正"}</small></div></div><div class="flow-step ${s.handoff?"done":""}"><span class="flow-num">3</span><div><strong>持续处理与交接</strong><small>后续消息由当前员工接收</small></div></div></div>${s.started&&s.employee==="meeting"?`<div class="handoff"><strong>这条需求还有一项工作</strong><p>“接待清单”需要另一种职责。是否创建独立会话交给项目助理？</p><button class="softbtn" type="button" data-action="a-handoff">交给项目助理</button></div>`:`<div class="handoff"><strong>模式观察</strong><p>${s.started?"对话负责人已固定。复合任务需要显式改派，或进一步设计协作。":"识别和交接集中在起始入口，后续追问不会每轮重新分配。"}</p></div>`}</aside>
      </div><div class="state-card panel">${aState(s)}</div>`;}
    function bState(s){const tasks=(s.meetingDone?1:0)+(s.listDone?1:0)+(s.booking==="done"?1:0);return `<span class="state-title">当前体验状态</span><div class="state-item"><small>对话负责人</small><strong>统一助理</strong></div><div class="state-item"><small>已完成子任务</small><strong>${tasks} / 3 项</strong></div><div class="state-item"><small>主任务状态</small><strong>${s.summary?"已汇总":s.booking==="confirmed"?"执行预约中":"等待专家与用户确认"}</strong></div>`;}
    function renderB(){const s=states.B;const tasks=[{key:"meeting",title:"查找 8 人会议室与可用时段",agent:"会议室助手",done:s.meetingDone,running:!s.meetingDone},{key:"list",title:"起草客户接待清单",agent:"项目助理",done:s.listDone,running:!s.listDone},{key:"booking",title:"提交会议预约",agent:"会议室助手",done:s.booking==="done",running:s.booking==="confirmed"}];return `<div class="layout b-layout">
      <section class="panel b-chat"><div class="b-header"><div class="avatar purple">统</div><div class="b-header-copy"><strong>统一助理 · 客户接待安排</strong><small>由我负责跟进全部事项和最终回复</small></div><span class="pill blue"><span class="dot"></span>协调中</span></div><div class="b-messages">${s.messages.map(text=>chatRow({who:"你",text})).join("")}${chatRow({who:"统一助理",employeeId:"project",text:s.summary?"接待安排已完成：会议预约已提交，接待清单已准备好。下面是两项结果。":s.booking==="confirmed"?"两位专家已完成查询。我会先等你确认具体会议参数，再提交预约。":`我把任务拆成 ${tasks.length} 项，交给相应员工并行处理。我会持续跟踪，最后向你汇总。`})}${s.summary?`<div class="summary-box"><strong>最终汇总 · 统一助理</strong><br>会议室：A 区 8 人间（15:00–16:00）<br>接待清单：来访登记、会议材料、访客 Wi-Fi</div>`:""}</div><form class="composer" data-form="b"><textarea name="message" aria-label="补充统一任务" placeholder="继续补充，统一助理会更新整体任务…"></textarea><button class="primary" type="submit">发送给助理</button></form><div class="composer-note">你始终与统一助理对话；专家负责后台子任务</div></section>
      <aside class="panel b-board"><div class="board-head"><div class="avatar blue">任</div><div style="flex:1"><h3>任务进度</h3><small>统一助理拥有主任务 · 专家各自执行子任务</small></div><span class="pill">${s.summary?"已完成":"进行中"}</span></div><div style="margin-top:15px">${tasks.map((task,i)=>`<div class="task ${task.done?"done":""} ${task.running?"running":""}"><span class="task-icon">${task.done?"✓":String(i+1)}</span><span class="task-copy"><strong>${task.title}</strong><small>执行者：${task.agent}</small></span><span class="task-state">${task.done?"完成":task.running?"执行中":task.key==="booking"?"等确认":"等待"}</span></div>`).join("")}</div><div class="board-controls">${!s.meetingDone?`<button type="button" class="softbtn" data-action="b-meeting">模拟会议查询完成</button>`:""}${!s.listDone?`<button type="button" class="softbtn" data-action="b-list">模拟清单完成</button>`:""}</div>${s.meetingDone&&s.listDone&&s.booking==="waiting"?`<div class="confirm-box"><strong><span class="pill amber">待你确认</span> 提交会议预约</strong><p>A 区 8 人间 · 明天 15:00–16:00 · 客户接待会议。统一助理展示具体参数后，仍需要你的明确确认。</p><button class="primary" type="button" data-action="b-confirm">确认并模拟预约</button></div>`:""}${s.booking==="confirmed"?`<div class="confirm-box"><strong><span class="pill green">确认已记录</span> 等待预约结果</strong><p>展示真实工具操作的结果核验状态；此原型只模拟完成，不会调用会议服务。</p><button class="softbtn" type="button" data-action="b-finish">模拟预约成功并汇总</button></div>`:""}${s.summary?`<div class="summary-box">主助理汇总了两个专家结果，并记录会议操作状态。</div>`:`<div class="rule"></div><div class="small muted">观察：任务能并行显示；但追问归属、专家失败、取消和部分成功都需要协调者解释。</div>`}</aside>
      </div><div class="state-card panel">${bState(s)}</div>`;}
    function cState(s){const last=s.messages.at(-1);return `<span class="state-title">当前体验状态</span><div class="state-item"><small>对话负责人</small><strong>${last?escapeHtml(last.employeeName):"逐轮判断"}</strong></div><div class="state-item"><small>对话领域</small><strong>${s.messages.length?new Set(s.messages.map(m=>m.employeeId)).size+" 个员工混合":"尚未开始"}</strong></div><div class="state-item"><small>需要关注</small><strong>${last&&last.uncertain?"本轮指代不明":"每轮独立标记实际回答者"}</strong></div>`;}
    function renderC(){const s=states.C;const transcript=s.messages.map(item=>`${chatRow({who:"你",text:item.text})}${chatRow({who:item.uncertain?"等待你澄清":item.employeeName,text:item.reply,employeeId:item.employeeId,tag:item.uncertain?"路由不确定":"本轮路由"})}<span class="route-badge ${item.uncertain?"uncertain":""}">${item.uncertain?"未自动执行业务操作 · 需说明所指":`本轮 → ${escapeHtml(item.employeeName)}`}</span>`).join("");const logs=s.messages.slice().reverse().map(item=>`<div class="route-log-item"><strong>${item.uncertain?"无法安全改派":item.employeeName}</strong><small>“${escapeHtml(item.text.slice(0,40))}”</small></div>`).join("");return `<div class="layout c-layout">
      <section class="panel c-chat"><div class="c-head"><div class="avatar gold">换</div><div class="c-head-copy"><strong>统一聊天窗口</strong><small>每条新消息独立识别处理员工</small></div><span class="pill amber">每轮路由</span></div><div class="c-transcript">${transcript||`<div style="padding:10px 0 18px">${chatRow({who:"系统提示",text:"同一聊天记录里，可能连续收到不同员工的回复。试着先聊会议，再问项目进度；最后发一句“改到四点”，观察路由是否能确定所指。",employeeId:"meeting",tag:"演示说明"})}</div>`}</div><div class="suggestions"><button type="button" data-action="c-fill" data-text="帮我预订明天下午的会议室">会议请求</button><button type="button" data-action="c-fill" data-text="项目周报和交付风险也帮我整理一下">项目任务</button><button type="button" data-action="c-fill" data-text="改到四点">模糊追问</button></div><form class="composer" data-form="c"><textarea name="message" aria-label="发送一轮消息" placeholder="例如：项目周报也帮我整理一下…">${escapeHtml(s.text)}</textarea><button class="primary" type="submit">发送本轮</button></form><div class="composer-note">示例：会议需求 → 项目进度 → “改到四点”</div></section>
      <aside class="panel c-side"><div class="label">本轮实际分配</div><h3 style="font-size:13px;margin:8px 0 3px">谁回答可能一直变化</h3><div class="small muted">每轮独立选择可以快速切换领域，但指代和历史归属更难预测。</div><div class="route-log">${logs||`<div class="route-log-item"><strong>等待第一条消息</strong><small>显式领域词触发演示路由</small></div>`}</div><div class="c-tip">“改到四点”脱离上下文无法确定目标。演示会暂停并询问，不会猜测要修改会议还是别的事项。</div></aside>
      </div><div class="state-card panel">${cState(s)}</div>`;}
    const SESSION_DATA={meeting:["下周项目复盘会议","客户接待会议","产品评审时间调整"],project:["季度复盘材料整理","客户拜访准备","产品路线图梳理"],expense:["杭州差旅报销","采购发票咨询","季度费用规则"]};
    function dState(s){const e=employee(s.employee);return `<span class="state-title">当前体验状态</span><div class="state-item"><small>当前员工</small><strong>${e.name}</strong></div><div class="state-item"><small>当前会话</small><strong>${escapeHtml(s.session)}</strong></div><div class="state-item"><small>切换时</small><strong>载入该员工自己的历史</strong></div>`;}
    function renderD(){const s=states.D,e=employee(s.employee);const names=SESSION_DATA[s.employee];const messages=s.messages.length?s.messages.map(item=>`${chatRow({who:"你",text:item.text})}${chatRow({who:e.name,employeeId:s.employee,text:item.reply,tag:"当前员工"})}`).join(""):chatRow({who:e.name,employeeId:s.employee,text:s.employee==="meeting"?"你好，我负责会议室查询和预约。接待清单属于另一项职责，可以完成会议后再交给对应员工。":"你好，我负责这个领域的工作。你可以在这里持续补充需求。"});return `<div class="layout d-layout panel">
      <aside class="d-employees"><div class="d-heading"><div class="label">员工空间</div></div>${EMPLOYEES.map(item=>`<button type="button" class="d-employee ${item.id===s.employee?"active":""}" data-action="d-employee" data-id="${item.id}"><span class="avatar ${item.tone}">${item.mark}</span><span class="d-employee-copy"><strong>${item.name}</strong><small>${item.description}</small></span></button>`).join("")}</aside>
      <aside class="d-history"><div class="d-history-head"><strong>${e.name} · 会话</strong><button type="button" class="d-new" data-action="d-new">＋ 新建</button></div>${names.map((title,i)=>`<div class="d-history-item ${s.session===title?"active":""}" data-action="d-session" data-title="${escapeHtml(title)}"><strong>${escapeHtml(title)}</strong><small>${i===0?"今天 10:42 · 最近打开":`昨天 · ${i+1} 条消息`}</small></div>`).join("")}<div class="d-switch-note">员工空间独立。选择另一位员工会打开其会话列表；当前对话留在原空间。</div></aside>
      <section class="d-thread"><div class="d-thread-head"><span class="avatar ${e.tone}">${e.mark}</span><div class="d-thread-head-copy"><strong>${e.name} · ${escapeHtml(s.session)}</strong><small>对话固定在当前员工空间 · 可随时切换员工</small></div><span class="pill green">负责人固定</span></div><div class="d-messages">${messages}${s.notice?chatRow({who:"系统",employeeId:"project",text:"你已切换到项目助理的独立空间。原会议会话仍在会议室助手的历史中，没有自动复制过去。",tag:"切换员工"}):""}</div><div class="d-compose-wrap"><form class="composer" data-form="d"><textarea name="message" aria-label="发送给当前员工" placeholder="发给${e.name}…">${escapeHtml(s.text)}</textarea><button class="primary" type="submit">发送</button></form><div class="composer-note">消息与会话归属：${e.name}</div></div></section>
      </div><div class="state-card panel">${dState(s)}</div>`;}
    function render(){renderTabs();$("#app-view").innerHTML=current==="A"?renderA():current==="B"?renderB():current==="C"?renderC():renderD();}
    function submit(form){const data=new FormData(form);const message=String(data.get("message")||"").trim();if(!message){toast("先输入一句需求，再看系统如何处理。");return;}if(current==="A"){const s=states.A;if(!s.started){s.employee=routeEmployee(message);s.messages=[message];s.started=true;}else{s.messages.push(message);}s.text="";render();return;}if(current==="B"){const s=states.B;s.messages.push(message);toast("已补充给统一助理，主任务与专家状态由它继续跟进。");render();return;}if(current==="C"){const s=states.C;const item={text:message,employeeId:"meeting",employeeName:"",reply:"",uncertain:false};if(/改到|那改|调整一下|这个改/.test(message)&&!/会议|项目|报销|发票|费用/.test(message)){item.uncertain=true;item.employeeName="需要澄清";item.reply="这句话没有说明要改哪件事。我先暂停，请告诉我会议时间、项目安排或其他具体目标。";}else{item.employeeId=routeEmployee(message);item.employeeName=employee(item.employeeId).name;item.reply=item.employeeId==="meeting"?"我收到会议相关消息。请确认时间、人数和会议室后继续。":item.employeeId==="project"?"我收到项目相关消息。请告诉我项目名称和希望查看的时间范围。":"我收到费用相关消息。请补充报销类型或发票信息。";}s.messages.push(item);s.text="";render();return;}if(current==="D"){const s=states.D;s.messages.push({text:message,reply:`我以${employee(s.employee).name}的职责接收了这条消息。需要另一位员工时，可以切换空间并继续。`});s.text="";render();}}
    function act(action,target){if(action==="a-fill"){states.A.text=SCENARIO;render();return;}if(action==="a-fill-project"){states.A.text="整理项目周报并提取本周交付风险";render();return;}if(action==="a-change"){states.A.employee=states.A.employee==="meeting"?"project":"meeting";toast(`已改派给${employee(states.A.employee).name}，请检查交接内容。`);render();return;}if(action==="a-handoff"){states.A.handoff=true;toast("已创建项目助理独立会话，演示交接摘要。");render();return;}if(action==="b-meeting"){states.B.meetingDone=true;toast("会议室助手已返回查询结果。");render();return;}if(action==="b-list"){states.B.listDone=true;toast("项目助理已返回接待清单。");render();return;}if(action==="b-confirm"){states.B.booking="confirmed";render();return;}if(action==="b-finish"){states.B.booking="done";states.B.summary=true;render();return;}if(action==="c-fill"){states.C.text=target.dataset.text;render();return;}if(action==="d-employee"){const s=states.D;const next=target.dataset.id;if(next===s.employee)return;s.savedSessions[`${s.employee}:${s.session}`]=JSON.parse(JSON.stringify(s.messages));s.employee=next;s.session=SESSION_DATA[next][0];s.messages=JSON.parse(JSON.stringify(s.savedSessions[`${next}:${s.session}`]||[]));s.text="";s.notice=true;toast(`已进入${employee(next).name}的独立会话。`);render();return;}if(action==="d-session"){const s=states.D;s.savedSessions[`${s.employee}:${s.session}`]=JSON.parse(JSON.stringify(s.messages));s.session=target.dataset.title;s.messages=JSON.parse(JSON.stringify(s.savedSessions[`${s.employee}:${s.session}`]||[]));s.notice=false;toast("已打开该员工的会话历史（示例）。");render();return;}if(action==="d-new"){const s=states.D;s.savedSessions[`${s.employee}:${s.session}`]=JSON.parse(JSON.stringify(s.messages));s.session="新的"+employee(s.employee).name+"会话";s.messages=[];s.notice=false;toast("已新建当前员工会话（示例）。");render();return;}}
    document.addEventListener("click",event=>{const modeButton=event.target.closest("[data-mode]");if(modeButton){setMode(modeButton.dataset.mode);return;}const actionButton=event.target.closest("[data-action]");if(actionButton){act(actionButton.dataset.action,actionButton);return;}if(event.target.id==="prev"||event.target.id==="next"){const index=MODES.findIndex(mode=>mode.id===current);const delta=event.target.id==="next"?1:-1;setMode(MODES[(index+delta+MODES.length)%MODES.length].id);}});
    document.addEventListener("input",event=>{if(event.target.matches("textarea[name=message]")){const value=event.target.value;if(current==="A")states.A.text=value;if(current==="C")states.C.text=value;if(current==="D")states.D.text=value;}});
    document.addEventListener("submit",event=>{const form=event.target.closest("form[data-form]");if(!form)return;event.preventDefault();submit(form);});
    document.addEventListener("keydown",event=>{if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;const index=MODES.findIndex(mode=>mode.id===current);setMode(MODES[(index+(event.key==="ArrowRight"?1:-1)+MODES.length)%MODES.length].id);});
    render();
  </script>
</body>
</html>
