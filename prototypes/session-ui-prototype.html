  <!-- Throwaway logic prototype: one employee draft, immutable releases, sessions pin releases.
       Unified employee publishing was accepted on 2026-10-20; runtime integration remains unimplemented. -->
  <script>
    const EmployeeConfigPrototype = (() => {
      const copy = value => JSON.parse(JSON.stringify(value));
      const equal = (a,b) => JSON.stringify(a) === JSON.stringify(b);
      const toolCatalog = [
        {name:'room.search',label:'查询会议室',write:false},
        {name:'identity.resolve',label:'查询参会人员',write:false},
        {name:'meeting.list_mine',label:'查询我的会议',write:false},
        {name:'room.reserve',label:'预约会议室',write:true},
        {name:'meeting.cancel',label:'取消会议',write:true}
      ];
      const baseline = {
        model:'qwen-plus',temperature:0.3,
        instruction:'你是企业会议室助手，帮助当前用户查询会议室、安排会议与取消会议。先核实必要信息；预约或取消前，展示具体目标与参数并取得当前用户确认。',
        skillEnabled:true,skillName:'meeting-assistant',
        skillText:'# 会议安排\n\n1. 查询可用会议室与参会人员。\n2. 明确会议室、时间和参会人员。\n3. 展示预约提案，取得当前用户确认后调用预约工具。\n4. 核对工具返回结果，不把未知结果当作成功。',
        mcp:'meeting-internal',credentialRef:'meeting-app-credential',
        tools:['room.search','identity.resolve','meeting.list_mine','room.reserve','meeting.cancel'],
        toolBindings:toolCatalog.map(t=>({name:t.name,contract:'schema-1',adapter:'adapter-1',confirmation:t.write?'当前用户具体提案确认':'无需写入确认'})),
        workspaceTemplate:'platform-default',memoryPolicy:'employee-user'
      };
      function initial(existing=[]) {
        return {draft:copy(baseline),saved:copy(baseline),releases:[{version:3,config:copy(baseline),time:'原型初始版本'}],current:3,
          sessions:copy(existing),message:'当前正式版 V3。你可以修改草稿，观察保存和发布的区别。',error:false};
      }
      const flags = s => ({unsaved:!equal(s.draft,s.saved),unpublished:!equal(s.saved,s.releases.find(r=>r.version===s.current).config)});
      function errors(config) {
        const list=[];
        if(!['qwen-plus','qwen-turbo'].includes(config.model))list.push('请选择平台已配置的模型');
        if(!config.instruction.trim())list.push('请填写员工指令');
        if(!Number.isFinite(config.temperature)||config.temperature<0||config.temperature>1)list.push('温度参数需要在 0 到 1 之间');
        if(config.skillEnabled&&(!config.skillName.trim()||!config.skillText.trim()))list.push('启用 Skill 时需提供名称和内容');
        if(config.mcp!=='meeting-internal')list.push('请选择已接入的会议 MCP');
        if(!config.tools.length)list.push('请选择至少一个允许调用的工具');
        return list;
      }
      function reduce(previous,action) {
        const s=copy(previous); s.error=false;
        if(action.type==='EDIT') {
          s.draft[action.field]=copy(action.value);
          if(action.field==='tools')s.draft.toolBindings=toolCatalog.filter(t=>action.value.includes(t.name)).map(t=>({name:t.name,contract:'schema-1',adapter:'adapter-1',confirmation:t.write?'当前用户具体提案确认':'无需写入确认'}));
          s.message='草稿已修改；正式版本与已有会话保持原配置。';
        } else if(action.type==='SAVE') {
          s.saved=copy(s.draft); s.message='草稿已保存。尚未发布，新会话仍使用 V'+s.current+'。';
        } else if(action.type==='PUBLISH') {
          const issues=errors(s.saved);
          if(flags(s).unsaved)issues.unshift('请先保存当前修改');
          if(!flags(s).unpublished)issues.push('没有需要发布的配置变化');
          if(issues.length){s.error=true;s.message=issues.join('；');return s;}
          const version=Math.max(...s.releases.map(r=>r.version))+1;
          s.releases.push({version,config:copy(s.saved),time:action.time||'刚刚'}); s.current=version;
          s.message='V'+version+' 已发布。后续新会话使用新版；已有会话仍使用原版本。';
        } else if(action.type==='SESSION') {
          s.sessions.unshift({id:action.id,title:action.title||'新建演示会话',version:'V'+s.current,owner:action.owner||'固定管理员'});
          s.message='已创建 '+s.sessions[0].title+'，固定使用 V'+s.current+'。';
        }
        return s;
      }
      return {copy,initial,reduce,flags,errors,toolCatalog};
    })();
  </script>

    function renderB(){const s=active();return `${commonHeader()}<main class="shell">${heading()}<div class="layout-b"><aside class="panel icon-rail"><div class="rail-brand">${employeeMark(activeEmployee())}</div><button class="rail-button active" title="会话">▤</button><button class="rail-button" title="切换数字员工" aria-label="切换数字员工" data-action="open-employee">✦</button><div class="top-spacer"></div><button class="rail-button" title="设置" data-action="toast" data-message="设置示例">⚙</button></aside><section class="panel b-main"><header class="b-header"><div class="b-session"><div class="b-title">${escapeHtml(s.title)}</div><div class="b-sub">${activeEmployee().name} · ${s.version} · ${s.date}</div></div><div class="b-status">${tag(s.readOnly?`${s.version} 只读`:`${s.version} 会话`,s.readOnly?"gray":"green")}</div>${canContinue(s)?`<button class="quiet" data-action="open-upgrade">在新版继续</button>`:historyButton(s)}<button class="ghost" data-action="toast" data-message="更多操作示例">•••</button></header><div class="b-content"><nav class="b-sessions"><div class="side-top"><span class="section-label">最近会话</span><button class="ghost" data-action="toast" data-message="会话搜索示例">⌕</button></div><div class="b-session-list">${sessionList(activeId,true)}</div></nav><section class="b-conversation"><div class="b-run-summary"><span class="run-pulse" style="background:#4d9a6e;box-shadow:0 0 0 4px #e7f3eb"></span><div class="b-run-main"><div class="b-run-title">${activeEmployee().id==="meeting"?"预约 3A · 已完成":"季度复盘材料整理 · 已完成"}</div><div class="small muted" style="margin-top:4px">RUN-24018 · ${activeEmployee().id==="meeting"?"结果已核对":"待确认 2 项"}</div></div><button class="quiet" data-action="toast" data-message="Run 事件展开示例">查看进度</button></div><div class="b-messages">${conversation()}</div>${composer()}<div class="b-footer-note">${s.readOnly?"历史版本只读 · 原始消息保留":"当前版本会话 · 前序版本可从历史查看"}</div></section></div></section></div></main>`}
    function renderLogin(){return `<main class="login-page"><section class="login-card"><div class="login-brand"><span>海卓智慧大脑</span></div><h1>登录</h1><form id="login-form"><label class="login-field"><span>手机号</span><input name="phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入手机号" required></label><label class="login-field"><span>密码</span><input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><button class="primary login-submit" type="submit">登录</button></form><div class="login-foot">演示手机号：普通用户 13800000001 · 固定管理员 13900000000</div></section></main>`}

    function adminHeader(section="平台概览"){

    function renderAdminOverview(){return `${adminHeader()}<main class="admin-shell"><div class="eyebrow">管理工作空间</div><h1 class="admin-title">平台管理</h1>${adminNav()}<div class="admin-grid"><section class="panel admin-metric"><div class="admin-metric-label">平台用户</div><div class="admin-metric-value">${users.length}</div></section><section class="panel admin-metric"><div class="admin-metric-label">已发布数字员工</div><div class="admin-metric-value">${employees.length}</div></section><section class="panel admin-metric"><div class="admin-metric-label">今日运行</div><div class="admin-metric-value">38</div></section></div><section class="panel admin-section"><h2>用户与身份状态</h2>${users.filter(u=>u.role!=="固定管理员").slice(0,3).map(u=>`<div class="session-row" data-user="${u.id}"><div class="session-icon">${escapeHtml(u.name.slice(0,1))}</div><div><div class="session-title">${escapeHtml(u.name)}</div><div class="session-meta">${maskedPhone(u.phone)} · ${u.meeting==="PASSED"?"会议工具可用":u.meeting==="UNAVAILABLE"?"会议 MCP 暂不可用":"会议身份待探测"}</div></div><span class="top-spacer"></span>${userTag(u)}</div>`).join("")}<button class="quiet" style="margin-top:10px" data-admin-page="users">管理全部用户</button></section><section class="panel admin-section"><h2>最近管理活动</h2><div class="key-value"><span>会议室助手</span><span>V2.0 · 已发布</span></div><div class="key-value"><span>用户授权变更</span><span>今天 09:32 · 已记录</span></div></section></main>`}
    function userPageHeading(){return `<div class="user-page-head"><div><div class="eyebrow">账号与身份管理</div><h2>用户管理</h2><p>选择一名用户后，在统一操作栏管理账号。手机号用于登录，姓名只用于展示。</p></div>${userSubPage==="accounts"?`<div class="meta-line"><button class="quiet" data-action="import-users">导入用户</button><button class="primary" data-action="create-user">＋ 手工开通</button></div>`:""}</div>`}

    function userToolbar(list){return `<div class="user-toolbar"><input class="user-search" id="user-search" type="search" placeholder="搜索姓名、手机号或 UserId" value="${escapeHtml(userSearch)}"><select class="user-select" id="user-status-filter"><option value="ALL" ${userStatusFilter==="ALL"?"selected":""}>全部账号状态</option><option value="ACTIVE" ${userStatusFilter==="ACTIVE"?"selected":""}>已启用</option><option value="DISABLED" ${userStatusFilter==="DISABLED"?"selected":""}>已停用</option></select><select class="user-select" id="user-meeting-filter"><option value="ALL" ${userMeetingFilter==="ALL"?"selected":""}>全部会议身份</option><option value="PASSED" ${userMeetingFilter==="PASSED"?"selected":""}>会议工具可用</option><option value="UNAVAILABLE" ${userMeetingFilter==="UNAVAILABLE"?"selected":""}>暂不可用</option><option value="UNCHECKED" ${userMeetingFilter==="UNCHECKED"?"selected":""}>待探测</option><option value="AUTH_OR_IDENTITY_REJECTED" ${userMeetingFilter==="AUTH_OR_IDENTITY_REJECTED"?"selected":""}>签名或身份失败</option></select><span class="user-count">显示 ${list.length} / ${users.length} 个账号</span></div>`}
    function selectedUserActions(u){if(!u)return `<section class="panel selected-actions"><span class="muted small">请先选择一名用户</span></section>`;const fixed=u.role==="固定管理员";return `<section class="panel selected-actions"><div class="selected-user-label"><div class="user-avatar">${escapeHtml(u.name.slice(0,1))}</div><div><strong>当前选择：${escapeHtml(u.name)}</strong><small>${fixed?"固定管理员 · 受控运维管理":"UserId U-"+String(u.id).padStart(6,"0")}</small></div></div>${fixed?`<span class="small muted">固定管理员的账号操作须走运维流程</span>`:`<button class="quiet" data-action="change-name" data-user-id="${u.id}">修改姓名</button><button class="quiet" data-action="change-phone" data-user-id="${u.id}">修改手机号</button><button class="quiet" data-action="reset-password" data-user-id="${u.id}">重置密码</button><button class="quiet" data-action="meeting-probe" data-user-id="${u.id}">重新探测</button><button class="quiet ${u.status==="ACTIVE"?"danger":""}" data-action="${u.status==="ACTIVE"?"disable-user":"enable-user"}" data-user-id="${u.id}">${u.status==="ACTIVE"?"停用账号":"重新启用"}</button>`}</section>`}
    function userDetail(u){if(!u)return `<section class="panel user-detail"><div class="empty-state">没有符合条件的用户</div></section>`;const fixed=u.role==="固定管理员";return `<section class="panel user-detail"><div class="user-detail-head"><div class="user-avatar">${escapeHtml(u.name.slice(0,1))}</div><div><h3>${escapeHtml(u.name)}</h3><div class="meta-line">${tag(u.role,fixed?"amber":"blue")}${userTag(u)}</div></div></div><div class="divider"></div><h4>账号信息</h4><div class="detail-row"><span>UserId</span><span>${`U-${String(u.id).padStart(6,"0")}`}</span></div><div class="detail-row"><span>登录手机号</span><span>${maskedPhone(u.phone)}</span></div><div class="detail-row"><span>名册核对记录</span><span>${escapeHtml(u.source||"—")} · ${escapeHtml(u.ownershipCheckedAt||"已记录")}</span></div>${u.phoneHistory?.length?`<div class="detail-row"><span>历史保留号码</span><span>${u.phoneHistory.map(maskedPhone).join("、")} · 不可登录</span></div>`:""}<div class="detail-row"><span>密码状态</span><span>${u.passwordChangeRequired?"下次登录需修改":"正常"}</span></div><div class="detail-row"><span>登录资格</span><span>${u.status==="ACTIVE"?"允许登录":"已停用，登录会话已撤销"}</span></div><div class="divider"></div><h4>会议工具身份</h4><div class="detail-row"><span>手机号账号探测</span><span>${meetingTag(u)}</span></div><div class="detail-row"><span>最近探测</span><span>${escapeHtml(u.checkedAt||"尚未探测")}</span></div><div class="detail-row"><span>手机号版本</span><span>R${u.phoneRevision||1}</span></div><div class="form-help" style="margin-top:12px">探测失败不影响平台登录，但会议工具不可用；MCP 仍会在每次工具请求时判权。</div></section>`}
    function grantUserItem(u,selected){return `<div class="grant-user ${selected?"selected":""}" data-grant-user="${u.id}"><div class="user-avatar">${escapeHtml(u.name.slice(0,1))}</div><div><strong>${escapeHtml(u.name)}</strong><small>${u.role==="固定管理员"?"固定管理员":"普通用户"} · ${u.status==="ACTIVE"?"已启用":"已停用"}</small></div></div>`}
    function grantPanel(u){if(!u)return `<section class="panel grant-panel"><div class="empty-state">选择用户后管理数字员工权限。</div></section>`;if(u.role==="固定管理员")return `<section class="panel grant-panel"><h3>固定管理员</h3><p>固定管理员默认可使用全部已发布数字员工。管理员角色不可在此修改。</p><div class="decision-banner">该权限来自固定管理员身份，不需要逐个创建授权记录。</div></section>`;return `<section class="panel grant-panel"><h3>数字员工授权</h3><p>为 ${escapeHtml(u.name)} 选择可使用的数字员工。停用账号不能发起 Run；重新启用不会恢复已撤销的授权。</p>${u.status==="DISABLED"?`<div class="modal-warning">该账号已停用。请先在“用户账号”页重新启用，再调整授权。</div>`:employees.map(employee=>`<label class="grant-employee"><input type="checkbox" data-grant="${employee.id}" data-user-id="${u.id}" ${u.employeeIds.includes(employee.id)?"checked":""}><span class="employee-mark">${employeeMark(employee)}</span><span class="grant-employee-copy"><strong>${escapeHtml(employee.name)}</strong><small>${escapeHtml(employee.description)}</small></span>${u.employeeIds.includes(employee.id)?tag("已授权","green"):tag("未授权","gray")}</label>`).join("")}</section>`}
    function directoryItem(u,selected){return `<div class="directory-item ${selected?"selected":""}" data-user="${u.id}"><div class="user-avatar">${escapeHtml(u.name.slice(0,1))}</div><div class="directory-item-copy"><strong>${escapeHtml(u.name)}</strong><small>${maskedPhone(u.phone)} · ${u.role}</small></div>${userTag(u)}</div>`}

    let configState=EmployeeConfigPrototype.initial(sessions.filter(s=>s.employeeId==='meeting').map(s=>({id:s.id,title:s.title,version:s.version,owner:'既有示例会话'})));
    let configTab='draft',configVersion=3,configGuide='happy',configStep=-1;
    const configGuides={
      happy:{label:'正常发布',description:'从 V3 开始：修改指令，保存草稿，然后发布。观察新会话从何时开始使用新版。',steps:[['修改指令',{type:'instruction'}],['保存草稿',{type:'SAVE'}],['发布新版',{type:'PUBLISH'}],['创建新会话',{type:'SESSION'}]]},
      skill:{label:'修改 Skill 后',description:'修改 Skill、保存并发布，再修改一次草稿。打开“已发布版本”查看 V3 和 V4 的内容，验证旧内容是否保持不变。',steps:[['替换 Skill 内容',{type:'skillText'}],['保存草稿',{type:'SAVE'}],['发布新版',{type:'PUBLISH'}],['再次修改 Skill',{type:'skillTextAgain'}]]},
      guard:{label:'未保存就发布',description:'修改后直接尝试发布应被阻止。再保存并发布，观察已有会话仍使用 V3。',steps:[['修改模型',{type:'model'}],['尝试直接发布',{type:'PUBLISH'}],['保存草稿',{type:'SAVE'}],['发布新版',{type:'PUBLISH'}]]}
    };
    const configCurrent=()=>configState.releases.find(r=>r.version===configState.current);
    const configSummary=c=>`${c.model} · 温度 ${c.temperature}\n${c.skillEnabled?c.skillName+'（'+c.skillText.length+' 字）':'未启用 Skill'}\n${c.tools.length} 个工具`;
    function configDispatch(action,rerender=true){
      if(action.type==='SESSION'){action={...action,id:'cfg-'+(configState.sessions.length+1),owner:currentUserName,title:'发布体验会话 '+(configState.sessions.length+1)}}
      configState=EmployeeConfigPrototype.reduce(configState,{...action,time:new Date().toLocaleString('zh-CN')});
      if(action.type==='PUBLISH'&&!configState.error){employees.find(e=>e.id==='meeting').latestVersion=configState.current;configVersion=configState.current}
      if(action.type==='SESSION'){
        const next=configState.sessions[0];
        sessions.unshift({...next,employeeId:'meeting',date:'刚刚',preview:'新会话 · 固定 '+next.version,state:'当前会话',configDemo:true});

    function parseCsvRows(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===","&&!quoted){row.push(field.trim());field=""}else if((ch==="\n"||ch==="\r")&&!quoted){row.push(field.trim());field="";if(row.some(v=>v!==""))rows.push(row);row=[];if(ch==="\r"&&text[i+1]==="\n")i++}else field+=ch}row.push(field.trim());if(row.some(v=>v!==""))rows.push(row);return rows}
    function validateImportCsv(){const text=document.getElementById("import-csv")?.value||"",rows=parseCsvRows(text.replace(/^\uFEFF/,""));if(!rows.length){toast("请先选择或粘贴 CSV 名单");return}const first=rows[0].map(v=>v.toLowerCase()),header=first.some(v=>["姓名","name"].includes(v))&&first.some(v=>["手机号","phone"].includes(v));const data=header?rows.slice(1):rows;const nameIndex=header?first.findIndex(v=>["姓名","name"].includes(v)):0,phoneIndex=header?first.findIndex(v=>["手机号","phone"].includes(v)):1,sourceIndex=header?first.findIndex(v=>["名册来源编号","来源编号","source"].includes(v)):2;const seen=new Set(),reserved=new Set(users.flatMap(u=>[u.phone,...(u.phoneHistory||[])]));importPreviewRows=data.map((values,index)=>{const name=(values[nameIndex]||"").trim(),phone=(values[phoneIndex]||"").trim(),source=(values[sourceIndex]||"").trim();let reason="";if(!name)reason="姓名缺失";else if(!/^1\d{10}$/.test(phone))reason="手机号格式错误";else if(!source)reason="名册来源编号缺失";else if(reserved.has(phone)||seen.has(phone))reason="手机号重复或曾被保留";if(phone)seen.add(phone);return{line:index+(header?2:1),name,phone,source,valid:!reason,reason}});renderImportPreview()}
    function renderImportPreview(){const root=document.getElementById("import-preview");if(!root)return;const valid=importPreviewRows.filter(x=>x.valid).length;root.innerHTML=`<div class="import-preview"><table class="import-table"><thead><tr><th>行</th><th>姓名</th><th>手机号</th><th>校验结果</th></tr></thead><tbody>${importPreviewRows.map(r=>`<tr><td>${r.line}</td><td>${escapeHtml(r.name||"—")}</td><td>${maskedPhone(r.phone)}</td><td class="${r.valid?"import-valid":"import-invalid"}">${r.valid?"可导入":escapeHtml(r.reason)}</td></tr>`).join("")}</tbody></table></div><div class="form-check"><input id="import-ownership" type="checkbox"><span>我已依据企业可信名册核对所有可导入号码的员工归属，并确认每行来源编号可追溯。</span></div><button class="primary import-confirm" data-action="confirm-import" disabled>确认导入 ${valid} 个账号</button><div class="import-list-note">错误行不会导入。导入完成后将一次性展示每个新账号的临时密码，请通过受控方式交付。</div>`}
    function confirmImport(){const attested=document.getElementById("import-ownership")?.checked;if(!attested){toast("请先确认已核对每行手机号归属");return}const eligible=importPreviewRows.filter(r=>r.valid);if(!eligible.length){toast("没有可导入的有效账号");return}const credentials=[];eligible.forEach(r=>{const id=Math.max(0,...users.map(x=>x.id))+1;users.push({id,name:r.name,phone:r.phone,role:"普通用户",status:"ACTIVE",meeting:"UNCHECKED",checkedAt:"尚未探测",source:r.source,ownershipCheckedAt:"刚刚",employeeIds:[],passwordChangeRequired:true,passwordRevision:1,phoneRevision:1});credentials.push({name:r.name,phone:r.phone,password:newTemporaryPassword()})});selectedUserId=users[users.length-credentials.length].id;closeAdminModal();render();showImportCredentials(credentials)}
    function showImportCredentials(credentials){showAdminModal(modalFrame(`已导入 ${credentials.length} 个账号`,"请通过企业受控方式交付以下一次性密码。本窗口关闭后，原型不会保留或再次显示。",`<div class="import-preview"><table class="import-table"><thead><tr><th>姓名</th><th>手机号</th><th>一次性密码</th></tr></thead><tbody>${credentials.map(c=>`<tr><td>${escapeHtml(c.name)}</td><td>${maskedPhone(c.phone)}</td><td><span class="temp-password">${c.password}</span></td></tr>`).join("")}</tbody></table></div><div class="modal-warning">所有用户首次登录都必须修改密码。新账号尚无数字员工授权，会议工具须等会议身份探测通过后才可用。</div>`,`<button class="primary" data-action="close-admin-modal">已安全交付</button>`))}
    function downloadImportTemplate(){const csv="姓名,手机号,名册来源编号\r\n赵女士,13800000021,EMP-1234\r\n";const url=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="用户导入模板.csv";a.click();URL.revokeObjectURL(url)}
    function showAdminModal(html){document.getElementById("admin-modal-content").innerHTML=html;document.getElementById("admin-modal").classList.add("open")}
    function closeAdminModal(){document.getElementById("admin-modal").classList.remove("open")}
    function modalFrame(title,description,body,actions){return `<div class="eyebrow">用户账号操作</div><h2 id="admin-modal-title">${title}</h2><p>${description}</p>${body}<div class="modal-actions">${actions}</div>`}
    function createUserDialog(){showAdminModal(modalFrame("手工开通用户","开通前由管理员核对企业员工名册。手机号作为登录标识，姓名只用于展示。",`<form id="create-user-form"><label class="login-field"><span>员工姓名</span><input name="name" maxlength="80" required placeholder="例如：赵女士"></label><label class="login-field"><span>登录手机号</span><input name="phone" type="tel" inputmode="numeric" maxlength="11" required placeholder="11 位手机号"><div class="form-help">当前和曾经登记过的号码都不能直接重复使用。</div></label><label class="login-field"><span>可信名册来源编号</span><input name="source" maxlength="100" required placeholder="例如：EMP-1234 或名册记录编号"></label><label class="form-check"><input name="ownership" type="checkbox" required><span>我已依据企业可信员工名册核对该手机号的员工归属。</span></label></form>`,`<button class="quiet" data-action="close-admin-modal">取消</button><button class="primary" type="submit" form="create-user-form">创建账号</button>`))}
    function changeNameDialog(u){showAdminModal(modalFrame("修改展示姓名",`更正 ${escapeHtml(u.name)} 的展示姓名。姓名不参与登录、UserId 或权限判断。`,`<form id="change-name-form" data-user-id="${u.id}"><label class="login-field"><span>展示姓名</span><input name="name" maxlength="80" required value="${escapeHtml(u.name)}"></label></form>`,`<button class="quiet" data-action="close-admin-modal">取消</button><button class="primary" type="submit" form="change-name-form">保存姓名</button>`))}
    function changePhoneDialog(u){showAdminModal(modalFrame(`修改 ${escapeHtml(u.name)} 的手机号`,`保留原 UserId 和历史会话。提交后撤销旧 Web 登录会话，并将会议账号探测重置为待检查。`, `<form id="change-phone-form" data-user-id="${u.id}"><label class="login-field"><span>新登录手机号</span><input name="phone" type="tel" inputmode="numeric" maxlength="11" required placeholder="11 位手机号"></label><label class="login-field"><span>可信名册来源编号</span><input name="source" maxlength="100" required placeholder="记录核对依据"></label><label class="form-check"><input name="ownership" type="checkbox" required><span>我已核对新号码属于该员工。原号码保留占用，转交他人需人工放行。</span></label><div class="modal-warning">正在执行的 Run 会在下一授权或工具调用点停止；已经发出的会议写操作仍需核对结果并记录审计。</div></form>`,`<button class="quiet" data-action="close-admin-modal">取消</button><button class="primary" type="submit" form="change-phone-form">保存手机号</button>`))}
    function resetPasswordDialog(u){showAdminModal(modalFrame(`重置 ${escapeHtml(u.name)} 的密码`,`系统生成一次性密码。操作会撤销该用户全部旧登录会话，首次登录后必须改密。`, `<div class="modal-warning">请通过企业受控方式交付一次性密码。密码只展示这一次，不会再次从账号页面取回。</div>`,`<button class="quiet" data-action="close-admin-modal">取消</button><button class="primary" data-action="confirm-reset" data-user-id="${u.id}">生成一次性密码</button>`))}
    function statusDialog(u){const disabling=u.status==="ACTIVE";showAdminModal(modalFrame(disabling?`停用 ${escapeHtml(u.name)}？`:`重新启用 ${escapeHtml(u.name)}？`,disabling?"停用后立即阻止登录和新 Run，并撤销旧登录会话。正在运行的 Run 在下一授权或工具调用点停止。":"启用后恢复登录资格，同时重置一次性密码并要求下次登录改密。已撤销的数字员工授权不会自动恢复。",`<div class="modal-warning">${disabling?"已经发出的会议平台写操作需要继续核对结果并保留审计。":"会议工具仍须当前手机号的会议 MCP 探测通过。"}</div>`,`<button class="quiet" data-action="close-admin-modal">返回</button><button class="primary" data-action="confirm-status" data-user-id="${u.id}" data-next-status="${disabling?"DISABLED":"ACTIVE"}">${disabling?"确认停用":"重新启用并重置密码"}</button>`))}
    function meetingProbeDialog(u){showAdminModal(modalFrame("模拟会议账号探测",`对 ${escapeHtml(u.name)} 的当前手机号模拟一次签名 tools/list 探测。实际工具调用仍由 MCP 每次判权。`,`<div class="modal-box"><div class="detail-row"><span>手机号</span><span>${maskedPhone(u.phone)}</span></div><div class="detail-row"><span>手机号版本</span><span>R${u.phoneRevision||1}</span></div><div class="form-help">这里仅更新原型示例状态，不会请求会议 MCP。</div></div><div style="display:grid;gap:8px"><button class="quiet" data-action="probe-result" data-status="PASSED" data-user-id="${u.id}">模拟探测成功</button><button class="quiet" data-action="probe-result" data-status="UNAVAILABLE" data-user-id="${u.id}">模拟服务暂不可用（503）</button><button class="quiet" data-action="probe-result" data-status="AUTH_OR_IDENTITY_REJECTED" data-user-id="${u.id}">模拟签名或身份失败（401）</button></div>`,`<button class="quiet" data-action="close-admin-modal">关闭</button>`))}
    function showTemporaryPassword(title,password){showAdminModal(modalFrame(title,"请通过企业认可的安全方式交付。离开此窗口后原型不会保留或再次显示该密码。",`<div class="modal-box"><div class="small muted">一次性初始密码</div><div class="temp-password" style="margin-top:9px">${password}</div></div><div class="modal-warning">用户首次登录必须修改密码。此原型只在内存中模拟流程。</div>`,`<button class="primary" data-action="close-admin-modal">已完成安全交付</button>`))}
    function newTemporaryPassword(){return `Tmp-${Math.random().toString(36).slice(2,6).toUpperCase()}!${Math.floor(10+Math.random()*89)}`}
    document.addEventListener("click",e=>{
      const page=e.target.closest("[data-admin-page]");if(page){adminPage=page.dataset.adminPage;render();return}
      const subpage=e.target.closest("[data-user-subpage]");if(subpage){userSubPage=subpage.dataset.userSubpage;render();return}
      const grantUser=e.target.closest("[data-grant-user]");if(grantUser){selectedUserId=Number(grantUser.dataset.grantUser);render();return}
      const actionButton=e.target.closest("[data-action]");
      if(actionButton){
        const action=actionButton.dataset.action,u=userById(actionButton.dataset.userId);
        if(action==="create-user")createUserDialog();
        else if(action==="import-users")importUsersDialog();
        else if(action==="download-template")downloadImportTemplate();
        else if(action==="validate-import")validateImportCsv();
        else if(action==="confirm-import")confirmImport();
        else if(action==="close-admin-modal")closeAdminModal();
        else if(action==="change-name"&&u&&u.role!=="固定管理员")changeNameDialog(u);
        else if(action==="change-phone"&&u&&u.role!=="固定管理员")changePhoneDialog(u);
        else if(action==="reset-password"&&u&&u.role!=="固定管理员")resetPasswordDialog(u);
        else if(action==="disable-user"||action==="enable-user"){if(u&&u.role!=="固定管理员")statusDialog(u)}
        else if(action==="meeting-probe"&&u)meetingProbeDialog(u);
        else if(action==="select-user"&&u){selectedUserId=u.id;render()}
        else if(action==="confirm-reset"&&u){u.passwordChangeRequired=true;u.securityVersion=(u.securityVersion||1)+1;closeAdminModal();showTemporaryPassword("一次性密码已生成",newTemporaryPassword())}
        else if(action==="confirm-status"&&u){const next=actionButton.dataset.nextStatus;u.status=next;u.securityVersion=(u.securityVersion||1)+1;if(next==="ACTIVE")u.passwordChangeRequired=true;render();if(next==="ACTIVE")showTemporaryPassword("账号已重新启用",newTemporaryPassword());else{closeAdminModal();toast("账号已停用，旧登录会话已撤销")}}
        else if(action==="probe-result"&&u){u.meeting=actionButton.dataset.status;u.checkedAt="刚刚（原型模拟）";closeAdminModal();render();toast(u.meeting==="PASSED"?"会议工具身份探测通过":u.meeting==="UNAVAILABLE"?"探测不可用；平台登录仍可使用":"身份或签名失败；不能据此判定手机号无效")}
        else return;
        return;
      }
      const row=e.target.closest("[data-user]");if(row){selectedUserId=Number(row.dataset.user);render();return}
    });
    document.addEventListener("change",e=>{
      if(e.target.id==="import-ownership"){const button=document.querySelector("[data-action=confirm-import]");if(button)button.disabled=!e.target.checked||!importPreviewRows.some(r=>r.valid);return}
      if(e.target.id==="user-status-filter"){userStatusFilter=e.target.value;render();return}
      if(e.target.id==="user-meeting-filter"){userMeetingFilter=e.target.value;render();return}
      const grant=e.target.closest("[data-grant]");if(grant){const u=userById(grant.dataset.userId),id=grant.dataset.grant;if(grant.checked&&!u.employeeIds.includes(id))u.employeeIds.push(id);if(!grant.checked)u.employeeIds=u.employeeIds.filter(x=>x!==id);render();toast("数字员工授权已更新（原型内存状态）")}
    });
    document.addEventListener("input",e=>{if(e.target.id!=="user-search")return;userSearch=e.target.value;const start=e.target.selectionStart;render();const input=document.getElementById("user-search");input?.focus();if(input&&start!==null)input.setSelectionRange(start,start)});
    document.addEventListener("submit",e=>{
      const create=e.target.closest("#create-user-form");if(create){e.preventDefault();const name=create.elements.name.value.trim(),phone=create.elements.phone.value.trim(),source=create.elements.source.value.trim();const reserved=users.some(u=>u.phone===phone||(u.phoneHistory||[]).includes(phone));if(!/^1\d{10}$/.test(phone)){toast("请输入 11 位手机号");return}if(reserved){toast("该手机号正在使用或曾被保留，需走人工放行流程");return}const u={id:Math.max(0,...users.map(x=>x.id))+1,name,phone,role:"普通用户",status:"ACTIVE",meeting:"UNCHECKED",checkedAt:"尚未探测",source,ownershipCheckedAt:"刚刚",employeeIds:[],passwordChangeRequired:true,passwordRevision:1,phoneRevision:1};users.push(u);selectedUserId=u.id;closeAdminModal();render();showTemporaryPassword("用户已开通",newTemporaryPassword());return}
      const changeName=e.target.closest("#change-name-form");if(changeName){e.preventDefault();const u=userById(changeName.dataset.userId);u.name=changeName.elements.name.value.trim();closeAdminModal();render();toast("展示姓名已更新；UserId 和权限不变");return}
      const change=e.target.closest("#change-phone-form");if(change){e.preventDefault();const u=userById(change.dataset.userId),phone=change.elements.phone.value.trim();if(!/^1\d{10}$/.test(phone)){toast("请输入 11 位手机号");return}const reserved=users.some(x=>x.id!==u.id&&(x.phone===phone||(x.phoneHistory||[]).includes(phone)));if(reserved){toast("该手机号正在使用或曾被保留，需人工核对并放行");return}u.phoneHistory=[...(u.phoneHistory||[]),u.phone];u.phone=phone;u.source=change.elements.source.value.trim();u.ownershipCheckedAt="刚刚";u.phoneRevision=(u.phoneRevision||1)+1;u.securityVersion=(u.securityVersion||1)+1;u.meeting="UNCHECKED";u.checkedAt="等待新手机号探测";closeAdminModal();render();toast("手机号已修改：旧登录会话撤销，会议身份待重新探测");return}
    });
    document.addEventListener("change",async e=>{if(e.target.id!=="import-file")return;const file=e.target.files?.[0];if(!file)return;document.getElementById("import-csv").value=await file.text();importPreviewRows=[];document.getElementById("import-preview").innerHTML=""});
    document.getElementById("admin-modal").addEventListener("click",e=>{if(e.target.id==="admin-modal")closeAdminModal()});
    // Reuse the original workspace, with new sessions taking the current published release.
    document.addEventListener('click',e=>{
      if(!e.target.closest('[data-action="new-session"]'))return;
      e.stopImmediatePropagation();
      if(activeEmployee().id==='meeting'){
        configDispatch({type:'SESSION'},false);activeId=configState.sessions[0].id;
      }else{
        const employee=activeEmployee(),id='normal-'+(sessions.length+1);
        sessions.unshift({id,employeeId:employee.id,title:'新建会话',date:'刚刚',preview:'新会话',version:'V'+employee.latestVersion,state:'当前会话',configDemo:true});activeId=id;lastActiveByEmployee[employee.id]=id;
      }
      render();toast('新会话已固定使用 '+active().version);
    },true);
    // Direct prototype entry only; not a production authentication mechanism.
    if(new URLSearchParams(location.search).get('page')==='employee-config'){
      view='admin';adminPage='employees';currentUserName='固定管理员';
    }
    window.addEventListener("popstate",render);render();
  </script>
</body>
</html>
