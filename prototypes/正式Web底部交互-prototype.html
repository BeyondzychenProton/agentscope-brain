<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#252b43;background:#f7f8fc;font-synthesis:none;--ink:#252b43;--muted:#83889d;--line:#e8eaf2;--brand:#6155df;--soft:#f1efff}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button{border:1px solid var(--line);background:#fff;color:inherit;border-radius:9px;padding:8px 12px}button:hover:not(:disabled){border-color:#b9b2f3;background:#faf9ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8c81f1;outline-offset:3px}.primary{background:var(--brand);color:white;border-color:var(--brand)}.primary:hover:not(:disabled){background:#5145c7;color:#fff}.quiet{border-color:transparent;background:transparent;color:#747990}.small{font-size:12px}.muted{color:var(--muted)}
.review{min-height:78px;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.review-title{font-size:14px;font-weight:650;display:flex;gap:10px;align-items:center}.review-title span{font-size:10px;letter-spacing:1px;color:#7e6b46;background:#fcf5e7;padding:4px 7px;border-radius:5px}.review p{font-size:11px;color:#8a8da0;margin:6px 0 0}.scenario{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:680px;gap:6px;white-space:nowrap}.scenario button{font-size:12px;padding:7px 10px}.scenario button.active{background:var(--soft);border-color:#d9d2ff;color:#6353cb}
.app{height:calc(100dvh - 116px);min-height:500px;display:flex;position:relative}.sidebar{width:248px;flex-shrink:0;border-right:1px solid var(--line);background:#fbfcff;padding:23px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 24px}.brand-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#766bec,#5146c5);color:white;font-size:21px}.brand b{font-size:15px}.brand small{display:block;font-size:8px;letter-spacing:1.5px;color:#989ab0;margin-top:4px}.new-chat{width:100%;text-align:left;color:#6252d0;border-color:#ded9fa;padding:11px 13px;background:#fff}.section-title{font-size:11px;color:#a1a5b5;margin:28px 12px 10px}.session{width:100%;text-align:left;padding:11px 12px;border-color:transparent;background:transparent;font-size:12px;margin-bottom:4px}.session.active{background:#eeecfb;color:#6253c3}.session small{display:block;color:#a1a1b0;font-size:10px;margin-top:5px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 9px 0;display:flex;align-items:center;gap:9px;font-size:12px}.avatar{width:29px;height:29px;background:#eeedf5;border-radius:50%;display:grid;place-items:center;color:#746a94}
.workbench{min-width:0;flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#fcfcff 0,#f8f9fd 100%)}.head{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#ffffffb8}.head h1{font-size:14px;font-weight:600;margin:0}.head p{font-size:10px;color:#999db1;margin:5px 0 0}.head-right{display:flex;align-items:center;gap:12px}.connection{font-size:11px;color:#7a8195}.dot{display:inline-block;height:6px;width:6px;border-radius:50%;background:#61ac8b;margin-right:5px}.offline .dot{background:#ca9b55}.head button{font-size:11px;padding:6px 10px}
.notice{padding:9px 28px;background:#fff7e9;color:#9c7430;font-size:12px;border-bottom:1px solid #f1e5ce;flex-shrink:0}.chat{min-height:90px;flex:1;overflow:auto;overscroll-behavior:contain;padding:28px 36px 14px;scrollbar-gutter:stable}.stream{max-width:760px;margin:0 auto}.day{text-align:center;font-size:10px;color:#a6a9b8;margin-bottom:24px}.message{display:flex;margin-bottom:22px;gap:13px}.message.user{justify-content:flex-end}.user .bubble{background:#efedfa;border:1px solid #e6e1f7;max-width:80%;border-radius:16px 16px 4px 16px;padding:11px 16px;font-size:13px;line-height:1.8}.ai-avatar{width:28px;height:28px;background:#fff;border:1px solid #e8e3f9;border-radius:9px;color:#6d5eda;display:grid;place-items:center;flex-shrink:0}.answer{max-width:100%;flex:1}.answer h2{font-size:11px;font-weight:500;color:#9a9caf;margin:2px 0 9px}.answer p{font-size:13px;line-height:1.85;margin:0 0 12px}.process{border:1px solid var(--line);border-radius:10px;background:#ffffffb5;padding:10px 12px;font-size:11px;color:#8a8a9c;margin:10px 0}.process summary{cursor:pointer;color:#77758f}.live-stage{color:#7163c8!important;font-size:12px!important;margin:10px 0 4px!important}.process-parameters{margin-top:10px;border-top:1px solid #ece8f5;padding-top:9px}.process-parameters p{font-size:11px;margin:7px 0 0;color:#9490a6}.process ul{padding-left:18px;line-height:2;margin:8px 0 0}.transcript-card{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;font-size:12px;margin-top:12px}.transcript-card b{display:block;font-size:12px;margin-bottom:7px}.transcript-card p{font-size:12px;margin:0;color:#82879b}.state-tag{display:inline-block;font-size:10px;line-height:1.4;padding:4px 7px;border-radius:5px;background:#eeecfc;color:#7161cb}.state-tag.green{background:#eaf5ee;color:#548767}.state-tag.orange{background:#fff2e2;color:#b18442}
.input-zone{flex-shrink:0;padding:0 30px 15px}.zone-inner{max-width:820px;margin:0 auto}.dock{background:#fff;border:1px solid #ded9f5;border-radius:17px;box-shadow:0 8px 26px #5144b50a;overflow:hidden}.dock-head{display:flex;justify-content:space-between;align-items:center;padding:14px 19px 12px;border-bottom:1px solid #f0edf7}.dock-head h3{font-size:14px;margin:0;letter-spacing:.2px}.dock-head p{font-size:11px;color:#9495a8;margin:6px 0 0}.dock-body{padding:14px 19px 8px;max-height:31dvh;overflow:auto}.field-label{display:flex;justify-content:space-between;font-size:12px;margin:0 0 9px}.field-label small{font-size:10px;color:#a2a4b1}.required{color:#c48b64;margin-left:3px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.person{display:flex;gap:10px;text-align:left;align-items:center;min-height:56px;padding:9px 12px;border-radius:10px}.person .circle{width:25px;height:25px;border-radius:8px;background:#f1eff8;color:#9b92b5;display:grid;place-items:center;font-size:11px}.person b{font-size:12px;font-weight:500;display:block}.person small{font-size:10px;color:#9a9dad;display:block;margin-top:4px}.person[aria-pressed=true]{background:#f5f3ff;border-color:#9f91eb}.person[aria-pressed=true] .circle{background:#e8e2fc;color:#7b63cf}.check{margin-left:auto;color:#7b66d9}.durations{display:flex;gap:8px;margin-bottom:8px}.durations button{padding:7px 20px;font-size:11px}.durations button[aria-pressed=true]{background:#f1eeff;border-color:#b0a4f1;color:#6e59cd}.dock-actions{padding:11px 19px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f2eff8;gap:12px}.dock-actions small{font-size:10px;color:#9999ad}.action-buttons{display:flex;gap:7px;align-items:center}.action-buttons button{font-size:12px;padding:8px 14px}.draft-links{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#a4a5b6;padding:8px 9px 0}.draft-links button{font-size:10px;padding:3px 5px}.input-hint{font-size:9px;text-align:center;margin:7px 0 0;color:#adb0bf}.scratch{margin-top:9px;border:1px dashed #d6d0ec;border-radius:10px;background:#fff;padding:9px 12px}.scratch label{font-size:10px;color:#9b95ae}.scratch textarea{width:100%;resize:vertical;min-height:46px;border:0;padding:7px 0;font-size:12px;color:#6f6d80}.composer{background:white;border:1px solid #e1ddef;border-radius:15px;padding:12px 15px}.composer textarea{width:100%;border:none;resize:none;height:46px;font-size:13px;background:transparent;color:#6e7288}.composer-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#9d9eb0}.composer-foot button{padding:6px 12px}.proposal{display:grid;grid-template-columns:80px 1fr;font-size:12px;line-height:2.1;column-gap:12px;margin:0 0 7px}.proposal dt{color:#9997aa}.proposal dd{margin:0}.error{font-size:11px;color:#b65d53;margin:0 0 10px}.empty{text-align:center;padding:35px 0;color:#a4a3b6;font-size:12px}.empty h2{font-size:20px;color:#77708f;font-weight:500}
.review-state{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border-top:1px solid var(--line);font-size:10px;color:#9c9cb0;gap:16px}.review-state strong{font-weight:500;color:#7a738f}.review-state .last-action{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}.toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);background:#38314c;color:#fff;font-size:12px;padding:10px 17px;border-radius:9px;z-index:20;box-shadow:0 6px 22px #30213c20;max-width:80%;display:none}.toast.visible{display:block}
@media(max-width:1350px){.sidebar{width:224px}.chat{padding:22px 26px 10px}.input-zone{padding:0 26px 12px}.review{padding:10px 18px}.review p{max-width:570px;line-height:1.5}.dock-body{padding:12px 17px 6px}.choices{margin-bottom:12px}.head{padding:0 26px}.review-title{font-size:13px}.review-state{font-size:9px}}
@media(max-height:760px){.review{min-height:74px}.app{height:calc(100dvh - 112px)}.dock-head{padding:11px 17px 9px}.dock-body{padding:10px 17px 5px;max-height:27dvh}.dock-actions{padding:9px 17px}.person{min-height:48px;padding:7px 10px}.chat{padding-top:18px}.day{margin-bottom:17px}.message{margin-bottom:17px}.person small{margin-top:2px}}
@media(max-width:900px){.sidebar{width:185px}.review{align-items:flex-start}.review p{max-width:380px}.scenario{flex-wrap:wrap;justify-content:flex-end}.choices{grid-template-columns:1fr}.review-state .last-action{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<!-- THROWAWAY PROTOTYPE. Question: Does a bottom question card preserve context, drafts and the separate operation confirmation? All state is in memory; no network calls or real booking. -->
<div id="root"></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const initialDraft=()=>({person:'',duration:'60'});
const state={scene:'form',stage:'FORM',session:'task',online:true,draft:initialDraft(),answered:false,saved:false,scratch:false,chat:{task:'',history:'',new:''},processOpen:false,paramsOpen:false,phase:3,error:'',last:'等待选择参会人；原型重开会重置'};
const people={product:{name:'张同学 · 产品组',note:'示例候选 A'},tech:{name:'张同学 · 技术组',note:'示例候选 B'}};
const stages={PREPARING:'正在处理（模拟）',FORM:'等待补充信息',CONFIRM:'等待单独确认预约',DONE:'预约成功（模拟）',UNKNOWN:'操作结果待核对',CANCELLED:'任务已取消（模拟）'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=()=>state.session==='task'?'预约产品评审会':state.session==='history'?'历史 · 查询会议室':'新会话';
const isPending=()=>state.session==='task'&&['FORM','CONFIRM'].includes(state.stage);
function toast(text){document.getElementById('toast').textContent=text;document.getElementById('toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').classList.remove('visible'),2800)}
const phaseLabels=['正在理解预约需求','正在提取日期、主题与参会人','正在查询会议室（模拟）','已发现同名候选，等待你补充信息'];
function processHTML(){
  const status=state.stage==='PREPARING'?phaseLabels[state.phase]:state.stage==='FORM'?'等待你补充信息':state.stage==='CONFIRM'?'等待你确认，预约尚未发送':state.stage==='DONE'?'已取得成功回执（模拟）':state.stage==='UNKNOWN'?'操作结果待核对（模拟）':'当前任务已终止（模拟）';
  const completed=['已理解预约需求','已识别日期与主题：10 月 28 日 15:00，产品评审会','已完成会议室只读查询（模拟）'];
  const visible=state.stage==='PREPARING'?completed.slice(0,state.phase):completed;
  const operation=state.stage==='DONE'?'已取得模拟预约成功回执':state.stage==='UNKNOWN'?'模拟请求已发送，结果尚未核实':'预约尚未发送';
  return `<details class="process" id="runProcess" ${state.processOpen?'open':''}><summary>执行过程 · ${status}</summary><p class="live-stage" role="status">${status}</p><ul>${visible.map(t=>`<li>✓ ${t}</li>`).join('')}${state.stage==='PREPARING'?`<li>◌ ${phaseLabels[state.phase]}</li>`:''}</ul><details class="process-parameters" id="processParameters" ${state.paramsOpen?'open':''}><summary>查看必要参数与结果摘要</summary><p>当前任务：产品评审会 · 2026-10-28 15:00 · 上海时间</p>${state.stage!=='PREPARING'?'<p>查询结果：17F · 示例会议室（模拟）</p>':''}${state.answered?`<p>已接纳的补充：${esc(people[state.draft.person]?.name)}；${esc(state.draft.duration)} 分钟</p>`:''}<p>预约操作：${operation}</p></details></details>`
}
function advancePhase(){
  if(state.stage!=='PREPARING'||state.scene!=='progress')return;
  state.phase=Math.min(state.phase+1,3);
  if(state.phase===3)state.stage='FORM';
  state.last='接收一条合成阶段更新：'+phaseLabels[state.phase];
  render();
}
function chatHTML(){if(state.session==='new')return `<div class="empty"><h2>开始一段新的对话</h2><p>这是新的会话视图。原预约任务仍保留在侧栏。</p></div>`;if(state.session==='history')return `<div class="day">历史演示 · 只读</div><div class="message user"><div class="bubble">帮我查一下 17 楼有哪些会议室。</div></div><div class="message"><div class="ai-avatar">✦</div><div class="answer"><h2>会议室助手</h2><p>这里展示上次查询的历史结果。</p><div class="transcript-card"><b>会议室查询 · 已完成</b><p>17F · 示例会议室，6 人；历史结果不代表现在仍有空闲。</p></div><div class="transcript-card"><b>历史交互 · 已回答，只读</b><p>楼层：17F。旧卡片保留当时的选择，没有重新提交按钮。</p></div></div></div>`;
let text=state.stage==='FORM'?'已找到 10 月 28 日下午 3 点的会议室。“张同学”有两个候选，请在底部选定参会人并确认会议时长。':state.stage==='CONFIRM'?'补充信息已接纳。请核对底部的具体预约提案，再单独确认本次预约。':state.stage==='DONE'?'会议已预约成功。这是合成演示回执，未连接真实会议服务。':state.stage==='UNKNOWN'?'预约请求的结果尚未核实。请先核对结果，当前不能再次预约。':'已取消当前任务。底部恢复普通输入，原来未发送的文字仍然保留。';
const questionText=state.stage==='PREPARING'?'我正在核对这次预约需要的信息。':'已找到 10 月 28 日下午 3 点的会议室。“张同学”有两个候选，请在底部选定参会人并确认会议时长。';
const questionCard=`<div class="transcript-card"><b>需要补充 2 项信息 <span class="state-tag">${state.answered?'已回答，只读':state.stage==='CANCELLED'?'已取消，只读':'等待填写'}</span></b><p>${state.answered?`当时的选择：${esc(people[state.draft.person]?.name)}；${esc(state.draft.duration)} 分钟。`:'同名参会人、会议时长 · 在底部填写。这里保留当前提问的上下文。'}</p></div>`;
const initialQuestion=`<div class="message"><div class="ai-avatar">✦</div><div class="answer"><h2>会议室助手 · 提问过程</h2><p>${questionText}</p>${['PREPARING','FORM'].includes(state.stage)?processHTML():''}${state.stage==='PREPARING'?'':questionCard}</div></div>`;
const acceptedAnswer=state.answered?`<div class="message user"><div class="bubble">补充信息已接纳：参会人 ${esc(people[state.draft.person]?.name)}；会议时长 ${esc(state.draft.duration)} 分钟。</div></div>`:'';
const laterProcess=!['PREPARING','FORM'].includes(state.stage)?`<div class="message"><div class="ai-avatar">✦</div><div class="answer"><h2>会议室助手 · 当前处理状态</h2><p>${text}</p>${processHTML()}${state.stage==='DONE'?`<div class="transcript-card"><b>预约回执 <span class="state-tag green">成功 · 模拟</span></b><p>示例会议室 · 2026-10-28 15:00 · ${esc(state.draft.duration)} 分钟<br>会议编号：DEMO-20261028（合成编号）</p></div>`:''}${state.stage==='UNKNOWN'?`<div class="transcript-card"><b>操作回执 <span class="state-tag orange">结果待核对</span></b><p>本地等待结束不能证明预约未发生；此处保留未知结果（模拟）。</p></div>`:''}</div></div>`:'';
return `<div class="day">2026 年 10 月 24 日 · 合成演示</div><div class="message user"><div class="bubble">约 10 月 28 日下午 3 点和张同学开产品评审会。</div></div>${initialQuestion}${acceptedAnswer}${laterProcess}`}
function formHTML(){return `<section class="dock" aria-label="底部补充信息表单"><div class="dock-head"><div><h3>补充会议安排</h3><p>产品评审会 · 10 月 28 日 15:00 · 上海时间</p></div><span class="state-tag">等待补充</span></div><div class="dock-body"><div class="field-label"><span>选择参会人<span class="required">*</span></span><small>同名候选 · 选一个</small></div><div class="choices">${Object.entries(people).map(([id,p])=>`<button type="button" class="person" data-person="${id}" aria-pressed="${state.draft.person===id}"><span class="circle">张</span><span><b>${p.name}</b><small>${p.note} · 合成人员</small></span><span class="check">${state.draft.person===id?'✓':'○'}</span></button>`).join('')}</div><div class="field-label"><span>会议时长<span class="required">*</span></span><small>已预填，可修改</small></div><div class="durations">${['30','60','90'].map(d=>`<button type="button" data-duration="${d}" aria-pressed="${state.draft.duration===d}">${d} 分钟</button>`).join('')}</div>${state.error?`<p class="error" role="alert">${state.error}</p>`:''}</div><div class="dock-actions"><small>提交只补充信息，预约仍需另行确认</small><div class="action-buttons"><button type="button" class="quiet" data-action="save" ${!state.online?'disabled':''}>保存草稿</button><button type="button" class="primary" data-action="submit" ${!state.online?'disabled':''}>提交补充信息 →</button></div></div></section>`}
function confirmHTML(){return `<section class="dock" aria-label="底部操作确认"><div class="dock-head"><div><h3>确认本次预约</h3><p>核对固定提案后再确认 · 演示不执行真实预约</p></div><span class="state-tag">单独确认</span></div><div class="dock-body"><dl class="proposal"><dt>会议主题</dt><dd>产品评审会</dd><dt>会议时间</dt><dd>2026-10-28 15:00 · ${esc(state.draft.duration)} 分钟（上海时间）</dd><dt>会议室</dt><dd>17F · 示例会议室</dd><dt>参会人</dt><dd>${esc(people[state.draft.person]?.name)}</dd></dl></div><div class="dock-actions"><small>仅同意这一份提案 · 有效期 10 分钟（不计时演示）</small><div class="action-buttons"><button type="button" class="quiet" data-action="cancel" ${!state.online?'disabled':''}>取消当前任务</button><button type="button" class="primary" data-action="confirm" ${!state.online?'disabled':''}>确认预约</button></div></div></section>`}
function composerHTML(){const unknown=state.session==='task'&&state.stage==='UNKNOWN';return `<div class="composer"><textarea id="chatDraft" aria-label="普通聊天草稿" placeholder="${unknown?'结果待核对，当前任务仍占用；可保留聊天草稿':'输入你的想法…（本原型仅保留草稿）'}">${esc(state.chat[state.session])}</textarea><div class="composer-foot"><span>${unknown?'不自动重试预约；聊天输入暂存为草稿':'普通消息执行不在本原型范围内'}</span><button type="button" disabled aria-label="发送（演示未接入）">↑</button></div></div>`}
function bottomHTML(){return `<div class="zone-inner">${isPending()?(state.stage==='FORM'?formHTML():confirmHTML()):composerHTML()}${isPending()?`<div class="draft-links"><span>${state.stage==='FORM'?(state.saved?'草稿已保存（模拟）':'草稿仅在本页内存；刷新会重置'):'表单已接纳，尚未发送预约'}</span><span><button type="button" class="quiet" data-action="scratch">${state.scratch?'收起聊天草稿':'查看未发送的聊天草稿'}</button>${state.stage==='FORM'?`<button type="button" class="quiet" data-action="cancel" ${!state.online?'disabled':''}>取消当前任务</button>`:''}</span></div>${state.scratch?`<div class="scratch"><label for="chatDraft">普通文字暂存为草稿，完成或取消当前任务后再发送</label><textarea id="chatDraft" aria-label="普通聊天草稿" placeholder="这里保留你尚未发送的文字">${esc(state.chat[state.session])}</textarea></div>`:''}`:''}<p class="input-hint">内存评审原型 · 人员、会议室、结果均为合成数据 · 不连接后端或真实会议系统</p></div>`}
function render(){const root=document.getElementById('root');root.innerHTML=`<header class="review"><div><div class="review-title">底部表单与独立确认 <span>THROWAWAY · 评审原型</span></div><p>位置按你的要求放在聊天底部；请体验填写、提交后单独确认、会话切换及断线。执行说明在聊天内更新，展开后可看参数及结果。场景切换重置演示。</p></div><nav class="scenario" aria-label="评审场景"><button type="button" data-scene="progress" class="${state.scene==='progress'?'active':''}">执行说明演示</button><button type="button" data-action="next-phase" ${state.stage!=='PREPARING'?'disabled':''}>下一条说明</button><button type="button" data-scene="form" class="${state.scene==='form'?'active':''}">补充信息</button><button type="button" data-scene="confirm" class="${state.scene==='confirm'?'active':''}">单独确认</button><button type="button" data-scene="unknown" class="${state.scene==='unknown'?'active':''}">结果待核对</button><button type="button" data-action="network">${state.online?'模拟断线':'恢复连接'}</button></nav></header><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><b>海卓智慧大脑</b><small>HAIZHUO AI WORKBENCH</small></div></div><button type="button" class="new-chat" data-session="new">＋ 新建对话</button><div class="section-title">今天</div><button type="button" class="session ${state.session==='task'?'active':''}" data-session="task">预约产品评审会<small>${stages[state.stage]}</small></button><div class="section-title">更早</div><button type="button" class="session ${state.session==='history'?'active':''}" data-session="history">查询会议室<small>历史 · 只读演示</small></button><div class="sidebar-bottom"><span class="avatar">演</span><span>演示用户<small class="muted" style="display:block;font-size:9px;margin-top:3px">单会议室数字员工</small></span></div></aside><main class="workbench"><header class="head"><div><h1>${title()}</h1><p>会议室助手 · ${state.session==='task'?stages[state.stage]:'独立会话视图'}</p></div><div class="head-right"><span class="connection ${state.online?'':'offline'}"><i class="dot"></i>${state.online?'连接正常':'连接已断开'}</span></div></header>${!state.online?`<div class="notice" role="status">连接已断开，任务状态未改变。保留本地输入，恢复连接后再提交。</div>`:''}<section class="chat" aria-label="消息历史"><div class="stream">${chatHTML()}</div></section><section class="input-zone" aria-label="底部交互区域">${bottomHTML()}</section></main></div><footer class="review-state" aria-label="原型状态"><span><strong>评审状态</strong>　当前会话：${title()}　·　预约任务：${stages[state.stage]}　·　参会人：${state.draft.person?esc(people[state.draft.person].name):'未选择'}　·　时长：${state.draft.duration} 分钟</span><span class="last-action">${esc(state.last)}</span></footer>`;
root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{state.draft.person=b.dataset.person;state.saved=false;state.error='';state.last='选择了候选人员；尚未提交';render();document.querySelector(`[data-person="${state.draft.person}"]`).focus()});
root.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{state.draft.duration=b.dataset.duration;state.saved=false;state.last='修改会议时长；尚未提交';render();document.querySelector(`[data-duration="${state.draft.duration}"]`).focus()});
root.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{state.session=b.dataset.session;state.last='切换展示会话，原任务与草稿未改变';render()});
root.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(b.dataset.scene));
root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
const processNode=root.querySelector('#runProcess');if(processNode)processNode.ontoggle=()=>{state.processOpen=processNode.open};
const paramsNode=root.querySelector('#processParameters');if(paramsNode)paramsNode.ontoggle=()=>{state.paramsOpen=paramsNode.open};
const draftInput=root.querySelector('#chatDraft');if(draftInput)draftInput.oninput=e=>{state.chat[state.session]=e.target.value};}
function action(name){if(name==='next-phase'){advancePhase();return;}if(['save','submit','confirm','cancel'].includes(name)&&!state.online)return;if(name==='save'){state.saved=true;state.last='模拟草稿保存，不代表提交回答';render();toast('模拟草稿已保存；刷新仍会重置此演示');return}if(name==='submit'){if(state.stage!=='FORM')return;if(!state.draft.person){state.error='请选择一个明确的参会人，再提交补充信息。';render();return}state.stage='CONFIRM';state.answered=true;state.saved=true;state.last='回答已接纳（模拟）；预约尚未发送，等待独立确认';render();toast('补充信息已接纳；请再核对并确认预约');return}if(name==='confirm'){if(state.stage!=='CONFIRM')return;state.stage='DONE';state.last='一次确认已消费，显示合成成功回执';render();toast('模拟预约成功；没有发出真实请求');return}if(name==='cancel'){if(!['FORM','CONFIRM'].includes(state.stage))return;state.stage='CANCELLED';state.last='未发送预约的演示任务已取消；聊天草稿保留';render();return}if(name==='network'){state.online=!state.online;state.last=state.online?'已恢复连接（模拟）；没有重启任务或重发操作':'仅模拟断线，原任务与草稿保持';render();return}if(name==='scratch'){state.scratch=!state.scratch;render();return}}
function setScene(scene){state.scene=['progress','form','confirm','unknown'].includes(scene)?scene:'form';state.stage={progress:'PREPARING',form:'FORM',confirm:'CONFIRM',unknown:'UNKNOWN'}[state.scene];state.draft=initialDraft();if(['confirm','unknown'].includes(state.scene))state.draft.person='product';state.session='task';state.online=true;state.saved=['confirm','unknown'].includes(state.scene);state.answered=['confirm','unknown'].includes(state.scene);state.scratch=false;state.paramsOpen=false;state.processOpen=state.scene==='progress';state.phase=state.scene==='progress'?0:3;state.error='';state.chat={task:'',history:'',new:''};state.last='已重置为所选合成场景；未连接真实服务';const url=new URL(location.href);url.searchParams.set('scene',state.scene);history.replaceState(null,'',url);render()}
setScene(new URLSearchParams(location.search).get('scene')||'form');
</script>
</body>
</html>
